const duelLinkLine = code => siteUrl() ? `\n${t('duelLink')} ${siteUrl('app/')}#duel=${code}` : '';
const errMsg = e => (e && (e.message || e.error_description || e.msg)) || String(e);
const within = (p, ms, what) => Promise.race([p, new Promise((_,no)=>setTimeout(()=>no(new Error(what||'timeout')), ms))]);
function cs(k, st, msg){ CS[k]={ st, msg:msg?String(msg).slice(0,180):'' }; try{ CS.onchange && CS.onchange(); }catch(e){} }

function loadScript(src, ms=15000){
  return new Promise((ok,no)=>{
    const s=document.createElement('script'); let fin=false;
    const end=e=>{ if(fin) return; fin=true; clearTimeout(tm); if(e){ s.remove(); no(e); } else ok(); };
    const tm=setTimeout(()=>end(new Error('timeout '+new URL(src).host)), ms);
    s.src=src; s.async=true; s.onload=()=>end(); s.onerror=()=>end(new Error('load '+new URL(src).host));
    document.head.appendChild(s);
  });
}
async function loadAny(urls, ready){
  if(ready()) return;
  let err;
  for(const u of urls){ try{ await loadScript(u); if(ready()) return; }catch(e){ err=e; } }
  throw err || new Error('sdk');
}
function devId(){
  if(!S.cfg.dev){
    let r=''; try{ r=Array.from(crypto.getRandomValues(new Uint8Array(8)), b=>b.toString(16).padStart(2,'0')).join(''); }
    catch(e){ r=Math.random().toString(16).slice(2)+Date.now().toString(16); }
    S.cfg.dev=r.slice(0,16); saveCfg();
  }
  return S.cfg.dev;
}
// ما يظهر للمستخدم من السحابة ينتظر هدوءاً: لا لوح مفتوح، ولا سؤال قيد الجواب، ولا لمسة قبل ثانيتين
let lastAct=0;
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, ()=>{ lastAct=Date.now(); }, true));
function whenIdle(fn, delay=600){
  const go=()=>{ if(!S.p) return;
    if($('#sheets').children.length || !$('#quiz').classList.contains('hidden') || Date.now()-lastAct<2000) return setTimeout(go, 1500);
    fn(); };
  setTimeout(go, delay);
}

/* ---------- Supabase: الهوية والمزامنة ---------- */
// الجلسة تُحفظ في مخزن التطبيق نفسه (Store: ذاكرة WebView الدائمة في أندرويد) فتبقى بعد إغلاق التطبيق
const sbStore = { getItem:k=>Store.get('sb:'+k), setItem:(k,v)=>Store.set('sb:'+k,v), removeItem:k=>Store.set('sb:'+k,null) };
async function sbClient(){
  if(SB) return SB;
  await loadAny(SDK.sb, ()=>window.supabase && window.supabase.createClient);
  SB = window.supabase.createClient(CLOUD.supabase.url, CLOUD.supabase.key, {
    auth:{ storage:sbStore, storageKey:'qt-auth', persistSession:true, autoRefreshToken:true, detectSessionInUrl:false, flowType:'pkce' } });
  return SB;
}
async function sbAuth(){
  const g = await within(SB.auth.getSession(), 15000, 'auth timeout');
  let session = g && g.data && g.data.session;
  if(!session){
    const r = await within(SB.auth.signInAnonymously(), 15000, 'auth timeout');
    if(r.error) throw r.error;
    session = r.data && r.data.session;
  }
  CS.auth = !!session;
  if(!session) throw new Error('no session');
  setSessionInfo(session);
  return session;
}
async function rpc(fn, args){
  const r = await within(SB.rpc(fn, args||{}), 15000, fn+' timeout');
  if(r.error) throw r.error;
  return r.data;
}
async function cloudStart(){
  if(!CLOUD || CS.started || !S.user) return;
  CS.started=true;
  if(S.cfg.ana===true) faInit();
  if(CLOUD.pubnub && !PN) pnInit().catch(e=>{ PN=null; cs('pn','err',errMsg(e)); });
  if(CLOUD.ably && !AB) abInit().catch(e=>{ AB=null; cs('ab','err',errMsg(e)); });
  if(!CLOUD.supabase) return;
  cs('sb','wait');
  try{ await sbClient(); }catch(e){ return cs('sb','err',errMsg(e)); }
  annLast(); dailyStats();
  if(S.cfg.noCloud) return cs('sb','ok');
  try{ await sbAuth(); await claim(); cs('sb','ok'); }
  catch(e){ cs('sb','err',errMsg(e)); }
}
async function cloudRetry(){
  if(CS.pn.st==='err'){ try{ PN && PN.destroy && PN.destroy(); }catch(e){} PN=null; }
  if(CS.ab.st==='err'){ try{ AB && AB.close(); }catch(e){} AB=null; }
  if(CS.fb.st==='err') FA=null;
  CS.started=false; await cloudStart();
}
// حجز الاسم المستعار: «new» يعيد رمز الاسترجاع مرة واحدة، و«taken» يعني أنه لجهاز آخر
async function claim(){
  const a=S.user.alias;
  let r = await rpc('qt_claim', { p_alias:a, p_seed:S.user.seed });
  if(r && r.status==='taken'){
    const rc=await Store.get('rc:'+a);                       // جهاز يعرف الرمز يستعيد ملكيته بصمت
    if(rc){ const ad=await rpc('qt_adopt', { p_alias:a, p_code:rc }); if(ad && ad.status==='ok') r={ status:'mine' }; }
  }
  const st = r && r.status;
  if(st==='new'){ const code=r.code; await Store.set('rc:'+a, code); if(!CS.google) whenIdle(()=>showRecovery(code), 900); track('sign_up', { method:CS.google?'google':'alias' }); }
  if(st==='new' || st==='mine'){ CS.mine=true; CS.taken=false; await cloudPull(); return; }
  if(st==='taken'){ CS.mine=false; CS.taken=true; if(!(S.cfg.loc||{})[a]) whenIdle(aliasTaken, 900); return; }
  throw new Error('claim: '+st);
}
// المزامنة: النسخة الأكثر تقدماً تغلب؛ والخادم يرفض أن يكتب جهاز متأخر فوق نسخة أحدث
async function cloudPull(){
  if(!CS.mine) return;
  const r = await rpc('qt_pull', { p_alias:S.user.alias });
  if(r && r.data && typeof r.data==='object' && (r.answered|0) > S.p.answered){
    S.p = upgrade(r.data); rollChallenges(); rollWeek();
    await Store.set('p:'+S.user.alias, S.p); pushBoard();
    if(!S.sess){ paintLobby(); buildRail(); }
    toast(t('cPulled'));
  } else if(!r || (r.answered|0) < S.p.answered) await cloudPush();
  CS.at=Date.now(); cs('sb','ok');
}
function cloudPushSoon(){
  if(!CS.mine || !SB || S.cfg.noCloud) return;
  clearTimeout(pushT);
  pushT=setTimeout(()=>cloudPush(), Math.max(8000, 45000-(Date.now()-pushLast)));
}
async function cloudPush(force=false){
  clearTimeout(pushT); pushT=0;
  if(!CS.mine || !SB || S.cfg.noCloud || !S.p) return false;
  if(pushing){ if(force) setTimeout(()=>cloudPush(true), 1500); return false; }
  pushing=true;
  try{
    rollWeek();
    const p=S.p;
    const r=await rpc('qt_push', { p_alias:S.user.alias, p_data:p, p_points:p.points, p_answered:p.answered, p_correct:p.correct,
                                   p_week:p.wk.k, p_week_points:p.wk.p, p_force:!!force,
                                   p_month:p.mo.k, p_month_points:Math.min(p.mo.p, p.points), p_best:Math.min(p.best||0, p.answered) });
    pushLast=Date.now();
    const st=r && r.status;
    if(st==='ok'){ CS.at=pushLast; cs('sb','ok'); return true; }
    if(st==='behind'){ pushing=false; await cloudPull(); return true; }
    if(st==='denied'){ CS.mine=false; CS.taken=true; cs('sb','ok'); }
    if(st==='invalid') cs('sb','err','invalid progress');
    return false;
  }catch(e){ cs('sb','err',errMsg(e)); return false; }
  finally{ pushing=false; }
}
async function readCloudBoard(v){
  const rows=await rpc('qt_board', { p_kind:v==='wk'?'week':v==='mo'?'month':'all', p_week:v==='mo'?monthKey():weekKey(), p_limit:100 });
  const num=x=>Number.isFinite(+x) ? Math.max(0,Math.round(+x)) : 0;
  return (rows||[]).map(r=>({ a:String(r.alias||'').slice(0,24), p:num(r.points), s:num(r.seed), n:num(r.answered), w:weekKey(), wp:num(r.week_points),
                             mp:num(r.month_points), rk:num(r.rank)||0, acc:num(r.acc) }));
}
async function cloudReport(item){
  if(!SB || !CS.auth) return false;
  try{ await rpc('qt_report', { p_qid:item.id, p_why:item.why, p_note:item.note||'', p_alias:item.by||'', p_bank:item.bank||'' }); return true; }
  catch(e){ return false; }
}

/* ---------- PubNub: من يتدرب الآن، وغرف التحدي ---------- */
async function pnInit(){
  cs('pn','wait');
  await loadAny(SDK.pn, ()=>window.PubNub);
  PN_ID='qt-'+devId();
  PN = new window.PubNub({ publishKey:CLOUD.pubnub.pub, subscribeKey:CLOUD.pubnub.sub, userId:PN_ID,
                           presenceTimeout:120, heartbeatInterval:55, restore:true });
  PN.addListener({
    status:e=>{
      const c=(e && e.category) || '';
      if(/^PN(Connected|Reconnected|SubscriptionChanged)Category$/.test(c)) cs('pn','ok');
      else if(/Denied|BadRequest|Error|Timeout|NetworkDown|NetworkIssues/.test(c)) cs('pn','err', c.replace(/^PN|Category$/g,''));
    },
    presence:e=>{
      if(!e) return;
      if(e.channel===LOBBY){ if(typeof e.occupancy==='number') setOnline(e.occupancy); return; }
      if(LIVE.room && e.channel===LIVE.room.ch && (e.action==='leave' || e.action==='timeout')){
        const r=LIVE.rivals[e.uuid]; if(r && !r.done){ r.gone=true; paintRivals(); }
      }
    },
    message:onRoomMsg
  });
  pnSubscribe();
  try{ const h=await PN.hereNow({ channels:[LOBBY], includeUUIDs:false }); if(h && typeof h.totalOccupancy==='number') setOnline(h.totalOccupancy); }catch(e){}
}
function pnSubscribe(){ if(!PN) return; const ch=[LOBBY]; if(LIVE.room) ch.push(LIVE.room.ch); try{ PN.subscribe({ channels:ch, withPresence:true }); }catch(e){} }
function setOnline(n){ LIVE.online=Math.max(0, n|0); paintOnline(); }
function paintOnline(){
  const el=$('#hRank'); if(!el) return;
  const old=el.querySelector('.onl'); if(old) old.remove();
  if(LIVE.online>=2) el.insertAdjacentHTML('beforeend',
    `<span class="onl" title="${esc(t('cOnline'))}" aria-label="${LIVE.online} ${esc(t('cOnline'))}"><i></i>${LIVE.online}</span>`);
}
function roomJoin(code){
  roomLeave();
  LIVE.rivals={}; LIVE.room={ code, ch:'qt-duel-'+String(code).replace(/[^A-Z0-9-]/gi,'') };
  if(!PN) return;
  pnSubscribe();
  setTimeout(()=>roomSend('hi'), 700);
}
function roomLeave(){
  if(!LIVE.room) return;
  const ch=LIVE.room.ch; LIVE.room=null; LIVE.rivals={};
  try{ PN && PN.unsubscribe({ channels:[ch] }); }catch(e){}
}
// لا يُبث في الغرفة إلا الاسم المستعار والتقدم والحصيلة عند الانتهاء، لا الأجوبة
function roomSend(kind, extra){
  if(!PN || !LIVE.room || !S.sess || S.sess.code!==LIVE.room.code) return;
  const s=S.sess;
  const m=Object.assign({ t:kind, a:S.user.alias, s:S.user.seed, i:s.answers.filter(a=>!a.skip).length, n:s.queue.length, done:!!s.over }, extra||{});
  try{ const p=PN.publish({ channel:LIVE.room.ch, message:m, storeInHistory:false }); if(p && p.catch) p.catch(()=>{}); }catch(e){}
}
function onRoomMsg(e){
  if(!e || !LIVE.room || e.channel!==LIVE.room.ch || e.publisher===PN_ID) return;
  const m=e.message; if(!m || typeof m!=='object') return;
  const id=String(e.publisher||'').slice(0,64); if(!id) return;
  const r=LIVE.rivals[id] || (LIVE.rivals[id]={});
  r.a=String(m.a||'?').slice(0,24); r.s=(+m.s>>>0) || hash(r.a);
  r.n=Math.min(30, Math.max(1, m.n|0)); r.i=Math.min(r.n, Math.max(0, m.i|0)); r.gone=false;
  if(m.done){ r.done=true; r.ok=Math.min(r.n, Math.max(0, m.ok|0)); }
  if(m.t==='hi'){ const s=S.sess; roomSend(s && s.over ? 'f' : 'st', s && s.over ? s.fin : null); }   // يرى القادم حالتك فوراً
  paintRivals();
  if(m.t==='f') setTimeout(duelBoardRefresh, 1200);
}
function paintRivals(){
  const el=$('#rivals'); if(!el) return;
  const list=Object.values(LIVE.rivals).filter(r=>!r.gone || r.done).slice(0,8);
  el.classList.toggle('hidden', !list.length);
  el.innerHTML = list.length ? `<span class="rl">${esc(t('cDuelLive'))}</span>` + list.map(r=>
    `<span class="rv${r.done?' done':''}">${seal(r.s,20,hue(r.s%360))}<bdi>${esc(r.a)}</bdi><em>${r.done?`${r.ok}/${r.n}`:`${r.i}/${r.n}`}</em></span>`).join('') : '';
}
async function duelFinish(s, ok, n, secs){
  s.fin={ ok, n, secs, done:true };
  track('duel_complete', { ok, n });
  roomSend('f', s.fin);
  paintRivals();
  if(SB && CS.mine){ try{ await rpc('qt_duel_result', { p_code:s.code, p_alias:S.user.alias, p_ok:ok, p_n:n, p_secs:secs }); }catch(e){} }
  duelBoardRefresh();
}
async function duelBoardRefresh(){
  const s=S.sess, el=$('#dboard');
  if(!el || !s || !s.code || !SB) return;
  let rows; try{ rows=await rpc('qt_duel_board', { p_code:s.code }); }catch(e){ return; }

  const others=rows.filter(r=>r.a!==S.user.alias).length;

    + (rows.length ? `<table><tbody>${rows.map((r,i)=>`<tr class="${r.a===S.user.alias && CS.mine?'me':''}"><td class="rk ${i<3?'top':''}">${i+1}</td>
        <td><div style="display:flex;align-items:center;gap:9px">${seal(r.s,22,hue(r.s%360))}<bdi>${esc(r.a)}</bdi></div></td>
        <td style="color:var(--muted);font-size:14px">${fmtSecs(r.secs)}</td><td class="p">${r.ok}/${r.n}</td></tr>`).join('')}</tbody></table>` : '')
    + (others ? '' : `<p class="meta" style="margin:8px 0 0">${esc(t('cDuelWait'))}</p>`);
}

/* ---------- Firebase: إحصاءات مجهولة بموافقة ---------- */
// استيراد ديناميكي مؤجَّل التحليل: محرك قديم لا يعرف import() لا يُسقط التطبيق كله
const dynImport = u => (new Function('u','return import(u)'))(u);
async function faInit(){
  if(FA || !CLOUD || !CLOUD.firebase) return;
  cs('fb','wait');
  try{
    const cap=window.Capacitor, br=window.QT_CAP;
    const native = (br && br.FirebaseAnalytics) || (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.isPluginAvailable && cap.isPluginAvailable('FirebaseAnalytics'));
    if(native){                                   // تطبيق أندرويد: الإضافة الأصلية بملف google-services.json (عبر جسر native.js)
      const P=(br && br.FirebaseAnalytics) || (cap.Plugins && cap.Plugins.FirebaseAnalytics) || (cap.registerPlugin && cap.registerPlugin('FirebaseAnalytics'));
      await P.setEnabled({ enabled:true });
      FA={ kind:'android', log:(n,p)=>P.logEvent({ name:n, params:p||{} }), off:()=>P.setEnabled({ enabled:false }) };
    } else {                                      // الويب والملف المستقل: حزمة Firebase الرسمية من gstatic
      let err;
      for(const v of SDK.fb){
        try{
          const [A,N]=await within(Promise.all([dynImport(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
                                                dynImport(`https://www.gstatic.com/firebasejs/${v}/firebase-analytics.js`)]), 20000, 'firebase timeout');
          if(!(await N.isSupported())) throw new Error('analytics unsupported here');
          const app=A.getApps().length ? A.getApp() : A.initializeApp(CLOUD.firebase);
          const an=N.getAnalytics(app);
          N.setAnalyticsCollectionEnabled(an, true);
          FA={ kind:'web '+v, log:(n,p)=>N.logEvent(an,n,p), off:()=>N.setAnalyticsCollectionEnabled(an,false) };
          break;
        }catch(e){ err=e; }
      }
      if(!FA) throw err || new Error('firebase');
    }
    cs('fb','ok', FA.kind);
    track('login', { method:'alias' });
  }catch(e){ FA=null; cs('fb','err',errMsg(e)); }
}
function setAna(on){
  S.cfg.ana=!!on; saveCfg();
  if(on) faInit();
  else { try{ FA && FA.off(); }catch(e){} FA=null; cs('fb','off'); }
}
// لا اسم مستعار ولا نص سؤال ولا جواب في أي حدث: الفرع والصعوبة والنتيجة فقط
function track(name, params){ try{ if(FA && S.cfg.ana===true){ const r=FA.log(name, params); if(r && r.catch) r.catch(()=>{}); } }catch(e){} }
// طلب الموافقة شريطٌ هادئ في الردهة لا لوحٌ يقطع العمل: يظهر بعد الجولة التعريفية ويبقى حتى يختار المستخدم

const fmtRc = c => String(c||'').replace(/[^0-9A-Z]/gi,'').toUpperCase().replace(/(.{4})(?=.)/g,'$1-');
async function showRecovery(given){

async function adopt(code){
  const v=String(code||'').replace(/[^0-9A-Z]/gi,'').toUpperCase();
  if(v.length<12){ toast(t('cBadCode')); return 'bad'; }
  try{
    if(!SB) await sbClient();
    if(!CS.auth) await sbAuth();
    const r=await rpc('qt_adopt', { p_alias:S.user.alias, p_code:v });
    const st=r && r.status;
    if(st==='ok'){
      await Store.set('rc:'+S.user.alias, v); CS.mine=true; CS.taken=false;
      if(S.cfg.loc) delete S.cfg.loc[S.user.alias];
      S.cfg.noCloud=false; saveCfg();
      toast(t('cAdopted')); await cloudPull(); return 'ok';
    }
    toast(t(st==='locked' ? 'cLocked' : 'cBadCode')); return st;
  }catch(e){ toast(t('cOffline')); return 'err'; }
}

/* ---------- الدخول بـ Google (Supabase OAuth بتدفق PKCE) ---------- */
// على الويب: تحويل إلى Google ثم عودة إلى الصفحة نفسها بـ ?code=… . وفي أندرويد: متصفح النظام (Google يمنع الدخول داخل WebView)
// ثم عودة إلى التطبيق برابط com.qanontahiro.app://auth-callback يلتقطه جسر native.js. والربط يحفظ الهوية نفسها، فيبقى الاسم وتقدمه.
const NATIVE_CB = 'com.qanontahiro.app://auth-callback';
const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const oauthRedirect = () => isNative() ? NATIVE_CB : location.origin + location.pathname;
function setSessionInfo(session){
  const u=session && session.user, g=((u && u.identities) || []).find(x=>x.provider==='google'), d=(g && g.identity_data) || {};
  CS.google = !!(u && !u.is_anonymous); CS.email = d.email || (u && u.email) || ''; CS.gname = d.full_name || d.name || '';
  CS.uid = (u && u.id) || '';
}
function openAuthUrl(url){
  const br = window.QT_CAP && window.QT_CAP.Browser;
  if(isNative() && br) return br.open({ url });
  location.href = url;
}
async function signInGoogle(force){
  try{
    await sbClient();
    const g=await SB.auth.getSession(), s=g.data && g.data.session;
    if(!force && s && s.user && s.user.is_anonymous){           // هذا الجهاز يملك حساباً: يُربط به Google ولا يُستبدل
      let mine=[]; try{ mine=await rpc('qt_my_aliases'); }catch(e){}
      if(mine && mine.length) return linkGoogle();
    }
    await Store.set('oauth:intent', 'signin');
    const r=await SB.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:oauthRedirect(), skipBrowserRedirect:true, queryParams:{ prompt:'select_account' } } });
    if(r.error) throw r.error;
    toast(t('gBusy')); openAuthUrl(r.data.url);
  }catch(e){ toast(t('gErr')+' — '+errMsg(e)); }
}
async function linkGoogle(){
  try{
    await sbClient(); if(!CS.auth) await sbAuth();
    await Store.set('oauth:intent', 'link');
    const r=await SB.auth.linkIdentity({ provider:'google', options:{ redirectTo:oauthRedirect(), skipBrowserRedirect:true, queryParams:{ prompt:'select_account' } } });
    if(r.error) throw r.error;
    toast(t('gBusy')); openAuthUrl(r.data.url);
  }catch(e){ toast(t('gErr')+' — '+errMsg(e)); }
}
async function oauthReturn(params){
  const code=params.get('code'), errc=params.get('error_code') || params.get('error'), desc=params.get('error_description') || '';
  try{ history.replaceState(null, '', location.pathname + location.hash); }catch(e){}
  const intent=await Store.get('oauth:intent'); await Store.set('oauth:intent', null);
  try{
    await sbClient();
    if(errc){
      if(/identity_already_exists|already linked|already exists/i.test(errc+' '+desc)){ if(confirm(t('gTaken'))) signInGoogle(true); return; }
      throw new Error(desc || errc);
    }
    if(!code) return;
    const r=await SB.auth.exchangeCodeForSession(code);
    if(r.error) throw r.error;
    setSessionInfo(r.data.session); CS.auth=true;
    track('login', { method:'google' });
    await googleDone(intent);
  }catch(e){ toast(t('gErr')+' — '+errMsg(e)); }
}
async function googleDone(intent){
  if(S.user){ toast(t('gDone')); if(CS.taken){ CS.started=false; await cloudStart(); } else cs('sb','ok'); return; }
  // الأسماء المملوكة لحساب Google هذا (محاولتان: لا يُنشأ اسم جديد لمن تعذّرت معرفة أسمائه)
  let list=null;
  for(let i=0;i<2 && list===null;i++){ try{ list=(await rpc('qt_my_aliases')) || []; }catch(e){ await new Promise(r=>setTimeout(r, 1200)); } }
  if(list && list.length===1){ if(intent==='link') setTimeout(()=>toast(t('gDone')), 1200); return enterAs(list[0].alias); }
  if(list && list.length>1) return pickAlias(list);
  const last=await Store.get('u:last');
  if(last && last.alias) return enterAs(last.alias);        // اسم هذا الجهاز ينتقل إلى حساب Google (برمز استرجاعه إن لزم)
  // مستخدم Google جديد: Google وحده يكفي، فلا يُطلب منه اسم مستعار. يدخل مباشرة باسم ظاهر يولّده التطبيق
  // (لا اسمه في Google: سياسة الخصوصية تَعِد بألا يظهر اسمه ولا بريده لأحد)
  const a = list ? await googleNewName() : null;
  if(a){ toast(t('gHello').replace('{n}', a)); return enterAs(a); }
  $('#alias').value=googleCandidate(); $('#enter').disabled=false;   // تعذّر الحجز الآلي: يبقى الدخول بضغطة واحدة
  paintLogin(); $('#alias').focus(); toast(t('gNew'));
}
// اسم ظاهر لمستخدم Google الجديد: «طالب 4821» بلغة الواجهة، فريد في اللوحة. الحجز في الخادم نفسه (qt_claim)،
// فإن سبقه مستخدم آخر إلى الاسم جُرّب غيره؛ ولا يُرسل اسمه في Google ولا بريده إلى أي مكان.
const googleCandidate = () => `${t('gBase')} ${1000 + Math.floor(Math.random()*9000)}`;
async function googleNewName(){
  for(let i=0;i<8;i++){
    const a=googleCandidate();
    let r=null; try{ r=await rpc('qt_claim', { p_alias:a, p_seed:hash(a) }); }catch(e){ return null; }
    if(r && r.status==='new'){ if(r.code) await Store.set('rc:'+a, r.code); track('sign_up', { method:'google' }); return a; }
    if(r && r.status==='mine') return a;
    if(!r || r.status!=='taken') return null;
  }
  return null;
}
function enterAs(alias){ $('#alias').value=alias; $('#enter').disabled=false; start(); }
function pickAlias(list){
  const w=sheet(`<h2>${t('gPick')}</h2>${list.map(x=>{ const sd=(+x.seed>>>0)||hash(String(x.alias));
    return `<button class="li" data-a="${esc(x.alias)}">${seal(sd,30,hue(sd%360))}<span class="nm"><bdi>${esc(x.alias)}</bdi><small>${x.answered} ${esc(t('ans'))} · ${x.points} ${esc(t('pts'))}</small></span></button>`; }).join('')}`);
  w.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ w.remove(); enterAs(b.dataset.a); });
}
async function googleSignOut(){
  if(!confirm(t('gOutQ'))) return;
  try{ await cloudPush(); }catch(e){}
  try{ await SB.auth.signOut(); }catch(e){}
  await Store.set('u:last',{ lang:S.lang }); location.reload();
}
function nativeAuthListen(){
  const app=window.QT_CAP && window.QT_CAP.App; if(!app || !isNative()) return;
  // الرابط نفسه قد يصل مرتين (getLaunchUrl عند إقلاع بارد ثم appUrlOpen): الرمز لا يُستبدل إلا مرة واحدة
  let seen='';
  const handle=url=>{
    url=String(url||''); if(!url.startsWith(NATIVE_CB) || url===seen) return; seen=url;
    try{ const br=window.QT_CAP.Browser; if(br) br.close().catch(()=>{}); }catch(e){}
    oauthReturn(new URL(url).searchParams);
  };
  try{ app.addListener('appUrlOpen', ev=>handle(ev && ev.url)); }catch(e){}
  try{ app.getLaunchUrl().then(r=>handle(r && r.url)).catch(()=>{}); }catch(e){}
}

/* ---------- «المساعد»: ذكاء اصطناعي مؤسَّس على نصوص القوانين وبنك الأسئلة (دالة qt-ai) ---------- */
const AI = { left:null, cap:null, capG:null, google:false, hist:[], ads:null };
async function aiCall(kind, payload){
  if(!CLOUD || !CLOUD.supabase) throw Object.assign(new Error('off'), { code:'off' });
  await sbClient(); if(!CS.auth) await sbAuth();
  const r=await within(SB.functions.invoke('qt-ai', { body:Object.assign({ kind, lang:S.lang }, payload||{}) }), 70000, 'ai timeout');
  let d=r.data;
  if(r.error){ try{ d=await r.error.context.json(); }catch(e){ d=null; } }
  if(d && typeof d.left==='number'){ AI.left=d.left; AI.cap=d.cap; AI.google=!!d.google; if(d.capGoogle) AI.capG=d.capGoogle; }
  if(d && d.ads) AI.ads=d.ads;
  if(!d || !d.ok) throw Object.assign(new Error((d && d.error) || 'ai'), { code:(d && d.error) || 'ai' });
  return d;
}
const aiErr = e => t({ quota:'aiQuota', budget:'aiQuota', config:'aiCfg', off:'aiOff', auth:'aiOff' }[e && e.code] || 'aiFail');
const quotaText = () => AI.cap!=null ? t('aiLeft').replace('{l}',AI.left).replace('{c}',AI.cap) : '';
const shimHTML = () => `<div class="aiCard"><span class="lbl">${esc(t('aiThink'))}</span><div class="shim"></div><div class="shim" style="width:82%"></div><div class="shim" style="width:58%"></div></div>`;
// [LAB-012] سؤال من البنك يُفتح، و[labour:41] مادة من المكتبة تُفتح بطاقتها تحت الجواب
const citeHTML = (s, arts) => { const byK={}; (arts||[]).forEach(a=>{ byK[a.key]=a; });
  return md(s).replace(/\[([A-Z]{2,5}-\d{1,5})\]/g, (m,id)=> IDX[id] ? `<button class="linkbtn" data-cite="${id}" dir="ltr">${id}</button>` : m)
    .replace(/\[([a-z_]{2,40}:[^\]]{1,30})\]/g, (m,k)=> byK[k] ? `<button class="ak" data-artk="${esc(k)}">${esc(byK[k].label)}</button>` : ''); };
// بطاقات المواد: النص كما في المكتبة، وحواشي الناشر منفصلة، وتنبيه إن صدر تعديل بعد تاريخ النص
const artsHTML = (arts, title) => !(arts||[]).length ? '' : `<span class="lbl">${esc(title || t(arts[0].related ? 'aiRelated' : 'aiArts'))}</span>` +
  arts.map(a=>`<details class="art" data-art="${esc(a.key)}"><summary><b>${esc(a.label)}</b><span>${esc(a.title)}</span></summary>
    ${a.path?`<div class="ap">${esc(a.path)}</div>`:''}<div class="at" dir="rtl">${a.text ? esc(a.text) : `<i>${esc(t('aiNoText'))}</i>`}</div>
    ${(a.notes||[]).length?`<div class="an"><b>${esc(t('aiNotes'))}:</b> ${a.notes.map(esc).join(' · ')}</div>`:''}
    ${(a.stale||[]).length?`<p class="warn">${esc(t('aiStale').replace('{l}', a.stale.map(x=>(x.law||'')+(x.date?' ('+x.date+')':'')).join('، ')))}</p>`:''}</details>`).join('');
function bindArts(root){
  root.querySelectorAll('[data-artk]').forEach(b=>b.onclick=()=>{ const card=b.closest('.aiCard') || root;
    const d=[...card.querySelectorAll('details.art')].find(x=>x.dataset.art===b.dataset.artk); if(!d) return;

function failHTML(e){ return `<div class="aiCard">${esc(aiErr(e))}${e && e.code==='quota' && !AI.google ? ` <button class="linkbtn" data-glink>${t('gLink')}</button>` : ''}${e && e.code==='quota' && adsCanAI() ? ` <button class="linkbtn" data-aiad>${esc(t('adAIBtn'))}</button>` : ''}</div>`; }
function bindCommon(root, close){
  bindArts(root);
  root.querySelectorAll('[data-cite]').forEach(b=>b.onclick=()=>{ const q=IDX[b.dataset.cite]; if(!q) return; if(close) close(); studyList([q], q.id); });
  const g=root.querySelector('[data-glink]'); if(g) g.onclick=()=>{ if(close) close(); linkGoogle(); };
  root.querySelectorAll('[data-aiflag]').forEach(b=>b.onclick=()=>openAiFlag(b.dataset.aiflag, b.closest('.aiCard') || root));
  root.querySelectorAll('[data-aiad]').forEach(b=>b.onclick=async()=>{ b.disabled=true;
    const okd=await adsRewardAI(); b.disabled=false; if(okd) b.remove();
    document.querySelectorAll('.sheet').forEach(s=>s.dispatchEvent(new Event('qt-aiq'))); });

// بلاغ عن جواب مولَّد (سياسة Google Play للمحتوى المولَّد بالذكاء الاصطناعي): يصل إلى لوحة المؤلف مع نص الجواب المبلَّغ عنه
const aiFlagBtn = (kind, ref) => `<button class="linkbtn" style="margin:0" data-aiflag="${esc(kind)}|${esc(ref||'')}">${esc(t('aiFlag'))}</button>`;
function openAiFlag(spec, card){
  const [kind, ref]=String(spec||'').split('|'), st={ r:0 };
  const snip=String((card && card.innerText) || '').replace(/\s+/g,' ').trim().slice(0, 420);
  const w=sheet(`<h2>${t('aiFlagT')}</h2>
    <div class="chips">${[1,2,3,4].map(i=>`<button class="chip" data-r="${i}" aria-pressed="false">${t('aiFl'+i)}</button>`).join('')}</div>
    <h3>${t('repNote')}</h3><textarea class="ta" id="afn" maxlength="160"></textarea>
    <button class="btn" id="afs" style="margin-top:14px;max-width:none" disabled>${t('repSend')}</button>`);
  w.querySelectorAll('[data-r]').forEach(el=>el.onclick=()=>{ st.r=+el.dataset.r;
    w.querySelectorAll('[data-r]').forEach(x=>x.setAttribute('aria-pressed', x===el)); w.querySelector('#afs').disabled=false; });
  w.querySelector('#afs').onclick=async()=>{
    const note=w.querySelector('#afn').value.trim();
    const item={ id:('AI:'+kind+':'+(ref||'-')).slice(0,40), why:'المساعد: '+T.ar['aiFl'+st.r], note:(note ? note+' — ' : '')+snip,
                 at:new Date().toISOString(), by:(S.user && S.user.alias)||'', bank:BANK.updated||'' };
    const list=(await Store.get('reports'))||[]; list.push(item); await Store.set('reports', list.slice(-300));
    w.remove();
    track('ai_flag', { kind, reason:st.r });
    toast(await cloudReport(item) ? t('cRepSent') : t('repSaved'));
  };
}

async function aiWhy(q, sel){
  const out=$('#aiOut'); if(!out) return; out.innerHTML=shimHTML();
  try{
    const d=await aiCall('why', { id:q.id, sel }), x=d.data;
    out.innerHTML=`<div class="aiCard"><h4>${esc(x.title||'')}</h4><p>${md(x.trap||'')}</p>
      ${(x.options||[]).map(o=>`<div class="ol"><i class="${o.ok?'y':'n'}">${esc(o.letter||'')}</i><span>${md(o.why||'')}</span></div>`).join('')}
      <span class="lbl">${t('aiRule')}</span><div class="box">${md(x.rule||'')}</div>
      ${x.hook?`<span class="lbl">${t('aiHook')}</span><p>${md(x.hook)}</p>`:''}
      ${x.check?`<span class="lbl">${t('aiCheck')}</span><p>${md(x.check.q||'')} <button class="linkbtn" data-ck>${t('aiShow')}</button></p><p class="hidden" data-ca>${md(x.check.a||'')}</p>`:''}
      ${artsHTML(x.articles, t('aiLibArt'))}
      ${x.guard===false?`<p class="warn">${t('aiGuard')}</p>`:''}
      <div class="meta2">${t('aiNote')} · ${esc(quotaText())} · ${aiFlagBtn('why', q.id)}</div></div>`;
    bindCommon(out);

async function aiTwin(q, n){
  const out=$('#aiOut'); if(!out) return; out.innerHTML=shimHTML();
  try{
    const d=await aiCall('twin', { id:q.id, n }), x=d.data, lt=lts();
    out.innerHTML=`<div class="aiCard tq"><span class="lbl">${t('aiTwinNote')}</span><p class="stem" dir="rtl" style="font-size:calc(18px * var(--fz));margin:6px 0 10px">${md(x.stem)}</p>
      ${x.options.map((o,i)=>`<button class="opt" data-i="${i}" aria-pressed="false"><span class="ltr">${lt[i]}</span><span class="tx">${md(o)}</span></button>`).join('')}
      <div class="duo" style="margin-top:8px"><button class="btn" data-go>${t('confirm')}</button>${n<2?`<button class="btn2" data-more>${t('aiTwinMore')}</button>`:''}</div>
      <div data-res></div><div class="meta2">${esc(x.law)}، ${esc(x.ref)} · ${t('aiNote')} · ${esc(quotaText())} · ${aiFlagBtn('twin', q.id)}</div></div>`;
    bindCommon(out);
    const card=out.querySelector('.aiCard'), sel=new Set();
    card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; sel.has(i)?sel.delete(i):sel.add(i); b.setAttribute('aria-pressed', sel.has(i)); });
    card.querySelector('[data-go]').onclick=e=>{
      const cor=x.correct; card.querySelectorAll('.opt').forEach(b=>{ const i=+b.dataset.i; b.disabled=true;
        if(cor.includes(i)) b.classList.add(sel.has(i)?'ok':'miss'); else if(sel.has(i)) b.classList.add('bad'); else b.classList.add('dim'); });
      const exact=cor.length===sel.size && cor.every(i=>sel.has(i));
      card.querySelector('[data-res]').innerHTML=`<span class="lbl">${t(exact?'right':'wrong')}</span><p>${md(x.explain||'')}</p>${x.rule?`<div class="box">${md(x.rule)}</div>`:''}`;
      e.target.remove(); };
    const more=card.querySelector('[data-more]'); if(more) more.onclick=()=>aiTwin(q, n+1);
    track('ai', { kind:'twin' });
  }catch(e){ out.innerHTML=failHTML(e); bindCommon(out); }

function planStats(){
  const p=S.p;
  const laws=Object.entries(p.byLaw||{}).filter(([k,v])=>v.a>=3).map(([k,v])=>({ key:k, title:lawTitle(k), a:v.a, c:v.c }))
    .sort((x,y)=>(x.c/x.a)-(y.c/y.a)).slice(0,10);
  const branches=BANK.branches.map(b=>{ const v=p.byBranch[b.id]||{a:0,c:0}; return { id:b.id, title:b.ar, a:v.a, c:v.c, n:BCOUNT[b.id]||0 }; });
  return { answered:p.answered, acc:p.answered?Math.round(p.correct/p.answered*100):0, streak:dayStreak(), due:dueList().length,
           wrong:Object.keys(p.wrong||{}).length, laws, branches, minutes:30 };
}
function runStep(s){
  if(s.kind==='law'){ const qs=BANK.questions.filter(q=>lawGroupKey(q)===s.ref); if(qs.length) return practiceList(qs.slice().sort(byDiff).slice(0,s.n), lawTitle(s.ref)); }
  if(s.kind==='branch' && byId(s.ref)) return openQuiz(s.ref);
  if(s.kind==='due') return openDue();
  if(s.kind==='wrong') return openQuiz('wrong');
  if(s.kind==='exam') return openQuiz('exam');
  if(s.kind==='oral') return openAI('oral');
  if(s.kind==='daily') return openDaily();
  openQuiz('mixed');
}

/* ---------- الإعلانات (أندرويد وحده، AdMob): تموّل التطبيق دون أن تقاطع التعلّم ----------
   القواعد: لا إعلان يقطع سؤالاً أبداً؛ الشريط في الردهة وحدها (ويُحجز مكانه فلا يغطي شيئاً)؛ الإعلان البيني
   بعد جلسة مكتملة فقط (5 أجوبة على الأقل)، بفاصل 4 دقائق، و8 في اليوم على الأكثر، ولا شيء في الدقائق الثلاث الأولى
   ولا في اليوم الأول؛ وإعلان شاشة الفتح لمن غاب ساعة فأكثر، مرة كل 4 ساعات، ولا يظهر فوق جلسة قائمة.
   وإعلان المكافأة باختيار المستخدم وحده: 3 طلبات إضافية لـ«المساعد» (يتحقق منها الخادم عبر AdMob)، أو ساعة دون إعلانات.
   الموافقة (UMP) أولاً، ولا طلب إعلان قبل canRequestAds. والنسخة غير الموقَّعة لا ترى إلا إعلانات Google التجريبية. */
const ADP = { startGraceMs:3*60e3, interGapMs:4*60e3, minAnswers:5, interPerDay:8, afterRewardMs:10*60e3,
              openAwayMs:60*60e3, openGapMs:4*3600e3, adFreeMs:60*60e3 };
const TEST_UNITS = { banner:'ca-app-pub-3940256099942544/9214589741', interstitial:'ca-app-pub-3940256099942544/1033173712',
                     rewarded:'ca-app-pub-3940256099942544/5224354917', appOpen:'ca-app-pub-3940256099942544/9257395921' };
const ADS = { on:false, ready:false, test:true, privacy:false, units:{}, st:null, full:false, lastFull:0, lastReward:0,
              bootAt:Date.now(), awayAt:0, bootFailed:false, listening:false,
              banner:{ shown:false, created:false, h:0, retry:0 }, inter:{ loaded:false, loading:false, retry:0 },
              reward:{ busy:false, earned:false, settle:null }, open:{ loaded:false, loading:false } };
// وصول متزامن إلى الإضافة (لا تُعاد من دالة async ولا يُنتظر الكائن نفسه: الوكيل يبدو «thenable»)
const adsP = () => (window.QT_CAP && window.QT_CAP.AdMob) || null;
const adsFree = () => !!(ADS.st && ADS.st.free > Date.now());
const adsSave = () => { if(ADS.st) Store.set('ads', ADS.st); };

async function adsBoot(){
  const A=adsP(); if(!A || !CLOUD || !CLOUD.admob || ADS.ready) return;
  ADS.on=true; ADS.bootFailed=false;
  ADS.test = window.QT_CAP.adsMode!=='live';
  ADS.units = ADS.test ? TEST_UNITS : { banner:CLOUD.admob.banner, interstitial:CLOUD.admob.interstitial, rewarded:CLOUD.admob.rewarded, appOpen:CLOUD.admob.appOpen };
  if(!ADS.st){ ADS.st=Object.assign({ first:'', day:'', n:0, open:0, free:0 }, (await Store.get('ads'))||{}); if(!ADS.st.first){ ADS.st.first=today(); adsSave(); } }
  adsListen(A);
  let info=null;
  try{ info=await within(A.requestConsentInfo({}), 10000, 'consent'); }catch(e){}
  if(info && info.status==='REQUIRED' && info.isConsentFormAvailable){ try{ info=await A.showConsentForm(); }catch(e){} }
  ADS.privacy = !!(info && info.privacyOptionsRequirementStatus==='REQUIRED');
  if(!info){ ADS.bootFailed=true; return; }                 // دون اتصال: يُعاد عند العودة إلى التطبيق
  if(!info.canRequestAds) return;                            // لا إعلان دون موافقة حيث تلزم
  for(let i=0;i<2 && !ADS.ready;i++){
    try{ await within(A.initialize({ initializeForTesting:ADS.test, maxAdContentRating:'ParentalGuidance',
                                     tagForChildDirectedTreatment:false, tagForUnderAgeOfConsent:false }), 12000, 'init'); ADS.ready=true; }
    catch(e){ await new Promise(r=>setTimeout(r, 3000)); }
  }
  if(!ADS.ready){ ADS.bootFailed=true; return; }
  adsObserve(); adsLoadInter(); adsLoadOpen(); adsSync();
}

function adsListen(A){
  if(ADS.listening) return; ADS.listening=true;
  const on=(ev, fn)=>{ try{ A.addListener(ev, fn).catch(()=>{}); }catch(e){} };
  on('bannerAdSizeChanged', i=>{ const h=Math.round((i && i.height)||0);
    if(h>0){ ADS.banner.h=h; adsReserve(); }
    else if(ADS.banner.shown){ ADS.banner.shown=false; ADS.banner.created=false; adsReserve(); } });
  on('bannerAdFailedToLoad', ()=>{ ADS.banner.shown=false; ADS.banner.created=false; adsReserve();
    clearTimeout(ADS.banner.retry); ADS.banner.retry=setTimeout(adsSync, 90e3); });
  on('interstitialAdLoaded', ()=>{ ADS.inter.loaded=true; ADS.inter.loading=false; });
  on('interstitialAdFailedToLoad', ()=>{ ADS.inter.loaded=false; ADS.inter.loading=false; setTimeout(adsLoadInter, 120e3); });
  on('interstitialAdShowed', ()=>{ ADS.full=true; });
  const interEnd=()=>{ ADS.full=false; ADS.lastFull=Date.now(); ADS.inter.loaded=false; adsSync(); setTimeout(adsLoadInter, 30e3); };
  on('interstitialAdDismissed', interEnd); on('interstitialAdFailedToShow', interEnd);
  on('onRewardedVideoAdShowed', ()=>{ ADS.full=true; adsSync(); });
  on('onRewardedVideoAdReward', ()=>{ ADS.reward.earned=true; });
  const rewEnd=()=>{ ADS.full=false; ADS.lastFull=ADS.lastReward=Date.now(); adsSync(); if(ADS.reward.settle) ADS.reward.settle(); };
  on('onRewardedVideoAdDismissed', rewEnd); on('onRewardedVideoAdFailedToShow', rewEnd);
  on('appOpenAdLoaded', ()=>{ ADS.open.loaded=true; ADS.open.loading=false; });
  on('appOpenAdFailedToLoad', ()=>{ ADS.open.loaded=false; ADS.open.loading=false; });
  on('appOpenAdOpened', ()=>{ ADS.full=true; });
  const openEnd=()=>{ ADS.full=false; ADS.lastFull=Date.now(); ADS.open.loaded=false; adsSync(); setTimeout(adsLoadOpen, 30e3); };
  on('appOpenAdClosed', openEnd); on('appOpenAdFailedToShow', openEnd);
  const app=window.QT_CAP.App;
  if(app) try{ app.addListener('appStateChange', s=>{ if(s && s.isActive) adsResume(); else ADS.awayAt=Date.now(); }).catch(()=>{}); }catch(e){}
}

// الشريط يتبع الشاشة: يظهر في الردهة، ويختفي فوق النوافذ والجلسات والدخول. والمكان المحجوز يبقى ما دامت الردهة تحت نافذة،
// فلا تهتز الصفحة كلما فُتحت نافذة وأُغلقت.
let adsSyncT=0;
function adsSync(){ clearTimeout(adsSyncT); adsSyncT=setTimeout(adsSyncNow, 120); }
async function adsSyncNow(){
  clearTimeout(adsSyncT);
  const A=adsP(); if(!A || !ADS.ready){ adsReserve(); return; }
  const want = adsLobby() && !adsFree() && !ADS.full && !ADS.reward.busy && !$('#sheets').children.length && !document.hidden;
  if(!adsLobbyCtx() || adsFree()){
    if(ADS.banner.created){ ADS.banner.created=false; ADS.banner.shown=false; try{ await A.removeBanner(); }catch(e){} }
  } else if(want && !ADS.banner.shown){
    ADS.banner.shown=true;
    try{
      if(ADS.banner.created) await A.resumeBanner();
      else { await A.showBanner({ adId:ADS.units.banner, adSize:'ADAPTIVE_BANNER', position:'BOTTOM_CENTER', margin:0, isTesting:ADS.test }); ADS.banner.created=true; }
    }catch(e){ ADS.banner.shown=false; ADS.banner.created=false; }
  } else if(!want && ADS.banner.shown){
    ADS.banner.shown=false; try{ await A.hideBanner(); }catch(e){}
  }
  adsReserve();
}
function adsReserve(){
  const h = ADS.banner.created && adsLobbyCtx() && !adsFree() ? ADS.banner.h : 0;
  document.documentElement.style.setProperty('--adh', h+'px');
}
function adsObserve(){
  const mo=new MutationObserver(adsSync);
  mo.observe($('#sheets'), { childList:true });
  mo.observe($('#quiz'), { attributes:true, attributeFilter:['class'] });
  mo.observe($('#lobby'), { attributes:true, attributeFilter:['class'] });
  document.addEventListener('visibilitychange', adsSync);
}

function adsLoadInter(){
  const A=adsP(); if(!A || !ADS.ready || ADS.inter.loaded || ADS.inter.loading) return;
  ADS.inter.loading=true;
  A.prepareInterstitial({ adId:ADS.units.interstitial, isTesting:ADS.test }).catch(()=>{ ADS.inter.loading=false; });
}
function adsLoadOpen(){
  const A=adsP(); if(!A || !ADS.ready || ADS.open.loaded || ADS.open.loading) return;
  ADS.open.loading=true;
  A.loadAppOpen({ adId:ADS.units.appOpen }).catch(()=>{ ADS.open.loading=false; });
}

// نهاية طبيعية: جلسة اكتملت أو نتيجة امتحان أُغلقت، والمستخدم عائد إلى الردهة
function adsBreak(s){
  const now=Date.now(), st=ADS.st; if(!st || !ADS.ready) return false;
  if(ADS.full || adsFree() || !ADS.inter.loaded) return false;
  if(st.first===today()) return false;
  if(now-ADS.bootAt < ADP.startGraceMs || now-ADS.lastFull < ADP.interGapMs || now-ADS.lastReward < ADP.afterRewardMs) return false;
  if(((s && s.answers) || []).filter(a=>!a.skip).length < ADP.minAnswers) return false;
  if(st.day!==today()){ st.day=today(); st.n=0; }
  if(st.n >= ADP.interPerDay) return false;
  st.n++; adsSave();
  setTimeout(async()=>{
    const A=adsP(); if(!A || ADS.full || !adsLobby() || $('#sheets').children.length){ st.n--; adsSave(); return; }
    ADS.full=true; await adsSyncNow();                       // يُخفى الشريط قبل أن يظهر الإعلان البيني لا بعده
    A.showInterstitial().catch(()=>{ ADS.full=false; ADS.lastFull=Date.now(); ADS.inter.loaded=false; adsSync(); adsLoadInter(); });
  }, 600);
  return true;
}

// العودة إلى التطبيق: إعلان شاشة الفتح لمن غاب طويلاً فقط (الرحلات القصيرة — إعلان، دخول Google، مكالمة — لا تحسب)
async function adsResume(){
  const away = ADS.awayAt ? Date.now()-ADS.awayAt : 0; ADS.awayAt=0;
  if(!ADS.ready){ if(ADS.bootFailed) adsBoot(); return; }
  adsSync();
  const A=adsP(), st=ADS.st;
  if(!A || away < ADP.openAwayMs || ADS.full || adsFree() || st.first===today()) return;
  if(Date.now()-(st.open||0) < ADP.openGapMs || !adsLobby()) return;
  let ok=false; try{ ok = !!(await A.isAppOpenLoaded()).value; }catch(e){}
  if(!ok){ ADS.open.loaded=false; adsLoadOpen(); return; }
  st.open=Date.now(); adsSave(); ADS.full=true; await adsSyncNow();
  A.showAppOpen().catch(()=>{ ADS.full=false; ADS.lastFull=Date.now(); adsSync(); });
}

// إعلان المكافأة: يُحمَّل عند الطلب بالمكافأة المقصودة (ssv لطلبات «المساعد» فقط) ← true إن شوهد حتى آخره
async function adsReward(kind){
  const A=adsP(); if(!A || !ADS.ready || ADS.full || ADS.reward.busy) return null;
  ADS.reward.busy=true; ADS.reward.earned=false; adsSync();   // لا شريط أثناء التحميل والعرض
  const tst=toastHold(t('adLoading'));
  try{
    const o={ adId:ADS.units.rewarded, isTesting:ADS.test };
    if(kind==='ai' && CS.uid) o.ssv={ userId:CS.uid, customData:'ai' };
    try{ await within(A.prepareRewardVideoAd(o), 20000, 'load'); }catch(e){ return null; }
    tst(); await adsSyncNow();
    const done=new Promise(r=>{ ADS.reward.settle=r; });
    A.showRewardVideoAd().catch(()=>{ if(ADS.reward.settle) ADS.reward.settle(); });
    await within(done, 300000, 'show').catch(()=>{});
    return ADS.reward.earned;
  } finally { tst(); ADS.reward.busy=false; ADS.reward.settle=null; adsSync(); }
}
function toastHold(m){ toast(m); return ()=>document.querySelectorAll('.toast').forEach(x=>{ if(x.textContent===m) x.remove(); }); }
const adsCanAI = () => ADS.ready && !!CS.uid && (!AI.ads || AI.ads.left>0);

// +3 طلبات لـ«المساعد»: يتحقق الخادم من الإعلان عبر AdMob؛ وقبل ضبط ذلك في AdMob يقبل مطالبة التطبيق بالحدود نفسها
async function adsRewardAI(){
  if(AI.ads && AI.ads.left<=0){ toast(t('adAINone')); return false; }
  const got=await adsReward('ai');
  if(got===null){ toast(t('adNoFill')); return false; }
  if(!got){ toast(t('adNoReward')); return false; }
  const cap0=AI.cap||0, ssv=!!(AI.ads && AI.ads.ssv);
  for(let i=0;i<(ssv?12:5) && (AI.cap||0)<=cap0;i++){ await new Promise(r=>setTimeout(r, 2000)); try{ await aiCall('quota'); }catch(e){} }
  if((AI.cap||0)<=cap0 && !ssv){
    try{ const r=await rpc('qt_ad_claim', { p_kind:'ai' }); if(r && r.ok) await aiCall('quota').catch(()=>{}); }catch(e){}
  }
  const okd=(AI.cap||0)>cap0;
  toast(t(okd ? 'adAIok' : 'adAIlater'));
  track('ad_reward', { kind:'ai', ok:okd });
  return okd;
}
async function adsRewardFree(){
  const got=await adsReward('adfree');
  if(got===null) return toast(t('adNoFill'));
  if(!got) return toast(t('adNoReward'));
  ADS.st.free=Date.now()+ADP.adFreeMs; adsSave(); adsSync();
  track('ad_reward', { kind:'adfree', ok:true });
  toast(t('adFreeOn'));
}

// مركز الإعلانات في «المزيد»: القواعد، وساعة دون إعلانات، ورصيد المساعد، وخيارات الخصوصية حيث يلزم
function openAds(){
  const hm=ts=>new Date(ts).toLocaleTimeString(S.lang==='ar'?'ar-MA':S.lang, { hour:'2-digit', minute:'2-digit' });
  const aiLeft = AI.ads ? AI.ads.left : 3;
  const w=sheet(`<h2>${t('adsT')}</h2><p class="meta sub" style="line-height:1.8">${esc(t('adsIntro'))}</p>
    ${ADS.test?`<p class="meta" style="color:var(--brass)">${esc(t('adTest'))}</p>`:''}
    <div class="aiCard"><b>${esc(t('adFreeT'))}</b><p class="meta" style="margin:4px 0 10px">${esc(adsFree() ? t('adFreeLeft').replace('{t}', hm(ADS.st.free)) : t('adFreeS'))}</p>
      <button class="btn2" id="adfree" style="width:100%" ${adsFree()||!ADS.ready?'disabled':''}>${ICO.ad} ${esc(t('adFreeT'))}</button></div>
    ${CLOUD && CLOUD.supabase ? `<div class="aiCard"><b>${esc(t('adAIT'))}</b><p class="meta" style="margin:4px 0 10px">${esc(t('adAIS').replace('{n}', aiLeft))}</p>
      <button class="btn2" id="adai" style="width:100%" ${adsCanAI()?'':'disabled'}>${ICO.ai} ${esc(t('adAIBtn'))}</button></div>` : ''}
    ${ADS.privacy?`<button class="li" id="adpriv">${ICO.gear}<span class="nm">${esc(t('adPriv'))}</span></button>`:''}`);
  const f=w.querySelector('#adfree'); if(f) f.onclick=async()=>{ w.remove(); await adsRewardFree(); };
  const a=w.querySelector('#adai'); if(a) a.onclick=async()=>{ w.remove(); await adsRewardAI(); };
  const p=w.querySelector('#adpriv'); if(p) p.onclick=async()=>{
    w.remove(); const A=adsP(); if(!A) return;
    try{ await A.showPrivacyOptionsForm(); const i=await A.requestConsentInfo({}); ADS.privacy=i.privacyOptionsRequirementStatus==='REQUIRED'; }catch(e){}
    adsSync();
  };
}

/* ---------- الروابط المباشرة والخلفية ---------- */
function deepLink(){
  let h=''; try{ h=decodeURIComponent(location.hash||''); }catch(e){ h=location.hash||''; }
  if(h.length<2) return;
  try{ history.replaceState(null, '', location.pathname+location.search); }catch(e){}
  const m=h.match(/^#duel=(.+)$/i);
  if(m && parseCode(m[1])) setTimeout(()=>playCode(m[1]), 500);
  else if(/^#daily$/i.test(h)) setTimeout(openDaily, 500);
}
// في الخلفية: تُرفع آخر التغييرات فوراً، وبعد دقيقة تُغلق الاتصالات الحية توفيراً للبطارية والحصص
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){
    if(pushT) cloudPush();
    clearTimeout(hideT);
    hideT=setTimeout(()=>{ CS.paused=true; try{ AB && AB.connection.close(); }catch(e){} try{ PN && PN.unsubscribeAll(); }catch(e){} }, 60000);
  } else {
    clearTimeout(hideT);
    if(CS.paused){ CS.paused=false; try{ AB && AB.connection.connect(); }catch(e){} pnSubscribe(); dailyStats(); }
  }
});
window.addEventListener('pagehide', ()=>{ if(pushT) cloudPush(); });

/* ---------- العمل دون اتصال (البناء المقسوم المنشور على الويب فقط) ---------- */
function regSW(){
  try{
    if(INLINE || !('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol) || window.Capacitor || window.QT_NATIVE) return;
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }catch(e){}
}

/* ---------- الإقلاع ---------- */
(async()=>{
  if(!BANK){                     // بناء مقسوم: القشرة تجلب البنك
    try{
      const r = await fetch('./questions.json');
      if(!r.ok) throw new Error(r.status);
      BANK = await r.json();
    }catch(e){
      document.body.innerHTML =
        '<div style="padding:40px;text-align:center;font-family:system-ui;color:#EDE4D2">'
        + 'تعذّر تحميل بنك الأسئلة.<br><small style="color:#8A97A6">questions.json — '
        + esc(e.message) + '</small></div>';
      return;
    }
  }
  indexBank();
  Object.assign(S.cfg, (await Store.get('cfg'))||{});
  applyCfg();
  matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{ if(S.cfg.theme==='auto'){ applyCfg(); if(S.p){ paintLobby(); buildRail(); } } });
  if(HAS_TTS){ try{ speechSynthesis.getVoices(); }catch(e){} }
  const i=$('#q'); i.oninput=paintSearch;
  $('#qx2').onclick=()=>{ i.value=''; paintSearch(); i.focus(); };
  const last=await Store.get('u:last');
  if(last&&last.lang) S.lang=last.lang;
  paintLogin();
  if(last&&last.alias){ $('#alias').value=last.alias; $('#enter').disabled=false; paintLogin();
    // رابط مباشر (#daily أو #duel=…) من الموقع أو من رسالة صديق: يدخل بالاسم الأخير ويفتح المطلوب
    if(/^#(daily|duel=)/i.test(location.hash)) start(); }
  const qp=new URLSearchParams(location.search);
  if(CLOUD && CLOUD.supabase && (qp.get('code') || qp.get('error_description') || qp.get('error_code'))) oauthReturn(qp);
  nativeAuthListen();
  adsBoot();
  regSW();
})();
</script>
