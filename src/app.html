<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12181F">
<title>قانون تاهيرو</title>
<!--__PWA__-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Markazi+Text:wght@400..700&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   «ليل فاس وزليجه» — نظام التصميم
   الداكن: ليل فاس بفوانيس النحاس · الفاتح: فخار فاس (أزرق كوبالتي على مينا بيضاء)
   الخطوط: ريم الكوفي للعناوين والأرقام · مركزي (نسخي) لقراءة النصوص القانونية
   ========================================================================= */
:root{
  --ink:#0D1A22; --ink2:#13252F; --ink3:#1B3241; --line:#284656;
  --brass:#D3A34E; --brass-dim:#8C6A2C; --brass-faint:rgba(211,163,78,.34); --on-brass:#1B1305;
  --fes:#3E9DB1; --fes-dim:#24606E; --on-fes:#04161B;
  --qirmiz:#C4434F;
  --jibs:#F0E7D6; --muted:#8FA3AE; --txt2:#CBD5DB;
  --brass-wash:rgba(211,163,78,.13); --fes-wash:rgba(62,157,177,.14); --qirmiz-wash:rgba(196,67,79,.13);
  --track:#0A141A; --scrim:rgba(5,12,16,.74); --warm:#2A2416;
  --display:"Reem Kufi","Noto Kufi Arabic","Noto Naskh Arabic",system-ui,sans-serif;
  --body:"Markazi Text","Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  --r:12px; --fz:1;
}
:root[data-theme="light"]{
  --ink:#F6F4EE; --ink2:#FFFFFF; --ink3:#ECE6D9; --line:#D9D0BF;
  --brass:#94660F; --brass-dim:#C9A865; --brass-faint:rgba(148,102,15,.30); --on-brass:#FFFAF0;
  --fes:#1F4F8C; --fes-dim:#9DB4D3; --on-fes:#FFFFFF;
  --qirmiz:#A92B3D;
  --jibs:#142232; --muted:#5D6A76; --txt2:#34404D;
  --brass-wash:rgba(148,102,15,.09); --fes-wash:rgba(31,79,140,.08); --qirmiz-wash:rgba(169,43,61,.07);
  --track:#E6DFD1; --scrim:rgba(20,34,50,.32); --warm:#F4ECD8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:var(--ink); color:var(--jibs); font-family:var(--body);
  font-size:16.5px; line-height:1.65; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button[disabled]{opacity:.38;pointer-events:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:6px}
.hidden{display:none!important}
.meta{font-size:14px;color:var(--muted)}
h1,h2,h3,h4{font-family:var(--display);font-weight:500}

/* ---------- شريط الزليج: نجوم وصلبان، يتلاشى نحو الأسفل ---------- */
.bg{position:fixed;inset:0 0 auto 0;height:400px;z-index:0;pointer-events:none;color:var(--brass);opacity:.11;
  -webkit-mask-image:linear-gradient(#000 10%,transparent 100%);mask-image:linear-gradient(#000 10%,transparent 100%)}
:root[data-theme="light"] .bg{color:var(--fes);opacity:.09}

/* ---------- الدخول ---------- */
#login{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;padding:28px}
#login .seal{filter:drop-shadow(0 8px 30px rgba(211,163,78,.28))}
#login h1{font-size:34px;font-weight:600;margin:0;letter-spacing:.3px}
#login p{margin:4px 0 0;color:var(--muted);font-size:17px;text-align:center;max-width:30ch}
.field{width:100%;max-width:340px}
.field input{width:100%;background:var(--ink2);border:1px solid var(--line);color:var(--jibs);
  border-radius:var(--r);padding:14px 16px;font:inherit;font-size:17.5px;text-align:center}
.field input::placeholder{color:var(--muted)}
.field input:focus{border-color:var(--fes);outline:none}
.btn{background:var(--brass);color:var(--on-brass);font-family:var(--display);font-weight:600;border-radius:var(--r);
  padding:14px 24px;width:100%;max-width:340px;font-size:16.5px;transition:transform .12s}
.btn2{background:transparent;border:1px solid var(--line);color:var(--jibs);font-family:var(--display);font-weight:500;
  border-radius:var(--r);padding:13px 18px;font-size:15.5px;transition:transform .12s}
.btn:active,.btn2:active{transform:scale(.975)}
.btn>svg,.btn2>svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-inline-end:4px}
.duo{display:flex;gap:9px}
.duo>*{flex:1;max-width:none}
.langrow{display:flex;gap:8px}
.langchip{border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:15px;color:var(--muted)}
.langchip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:var(--brass-wash)}

/* ---------- الردهة ---------- */
#lobby{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;padding-bottom:var(--adh,0px)}
header{display:flex;align-items:center;gap:10px;padding:14px 16px 4px}
.avatarbtn{border-radius:50%;line-height:0;border:1.5px solid var(--brass-dim);padding:2px}
.who{flex:1;min-width:0}
.who b{font-family:var(--display);font-weight:500;font-size:18.5px;display:block;line-height:1.35;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{color:var(--muted);font-size:14.5px}
.who .fl{color:var(--brass);white-space:nowrap;margin-inline-start:10px}
.icobtn{width:40px;height:40px;border-radius:12px;background:transparent;border:1px solid var(--line);
  display:grid;place-items:center;flex:none;position:relative}
.icobtn svg{width:19px;height:19px;stroke:var(--jibs);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icobtn .pip{position:absolute;top:6px;inset-inline-end:6px;width:9px;height:9px;border-radius:50%;
  background:var(--qirmiz);border:2px solid var(--ink)}

/* الوردة: كل بتلة فرع، تمتلئ بلونه كلما تقدم المستخدم فيه */
.hero{display:flex;align-items:center;gap:18px;padding:6px 16px 14px}
.rosette{width:172px;height:172px;flex:none;overflow:visible}
.rosette .po{fill:var(--ink2);stroke:var(--brass-faint);stroke-width:1.15}
.rosette .pf{opacity:.95}
.rosette .pt{cursor:pointer;outline:none}
.rosette .pt:hover .po,.rosette .pt:focus-visible .po{stroke:var(--brass);stroke-width:1.8}
.rosette .core{fill:var(--ink);stroke:var(--brass);stroke-width:1.4}
.rosette .pts{font-family:var(--display);font-weight:600;fill:var(--brass)}
.rosette .ptl{font-family:var(--body);fill:var(--muted)}
.hstats{flex:1;min-width:0}
.hstats div{display:flex;align-items:baseline;gap:9px;padding:7px 0;border-bottom:1px solid var(--line)}
.hstats div:last-child{border-bottom:0}
.hstats b{font-family:var(--display);font-size:21px;font-weight:600;min-width:2.8ch;font-variant-numeric:tabular-nums;line-height:1.2}
.hstats span{font-size:15px;color:var(--muted)}

/* سؤال اليوم: وثيقة بإطار مزدوج وختم */
.decree{display:block;width:calc(100% - 32px);margin:0 16px 14px;text-align:start;background:var(--ink2);
  border:1px solid var(--brass-dim);border-radius:5px;padding:14px 16px;padding-inline-end:96px;position:relative;flex:none;
  box-shadow:inset 0 0 0 4px var(--ink2),inset 0 0 0 5px var(--brass-faint)}
.decree .dh{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.decree .dh b{font-family:var(--display);font-weight:500;font-size:16.5px;color:var(--brass)}
.decree .dh span{font-size:14px;color:var(--muted)}
.decree .dt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:17px;line-height:1.7}
.decree .ds{position:absolute;inset-inline-end:12px;top:50%;margin-top:-34px;line-height:0}

/* أدوات سريعة: أقراص هادئة لا بطاقات متماثلة */
.tools{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;scrollbar-width:none;flex:none}
.tools::-webkit-scrollbar{display:none}
.tool{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:15.5px;white-space:nowrap;background:transparent}
.tool svg{width:17px;height:17px;stroke:var(--tc,var(--brass));fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tool em{font-style:normal;color:var(--muted);font-size:14px}
.tool .dot{background:var(--qirmiz);color:#fff;font-family:var(--display);font-size:12px;font-style:normal;
  min-width:21px;height:21px;border-radius:11px;display:grid;place-items:center;padding:0 6px}

.pick{padding:6px 16px 8px;display:flex;align-items:baseline;justify-content:space-between}
.pick h2{font-size:19px;margin:0}
.pick em{font-style:normal;font-size:14px;color:var(--muted)}

/* ---------- شريط الفروع: كل فرع غلاف مدونة بإطار داخلي بلونه ---------- */
.rail{flex:1;min-height:244px;position:relative;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.track{direction:ltr;display:flex;gap:14px;padding:6px 16px;height:100%;align-items:center;
  will-change:transform;cursor:grab;touch-action:pan-y}
.track.drag{cursor:grabbing}
.card{flex:none;width:150px;height:216px;border-radius:7px;padding:20px 15px 18px;background:var(--ink2);
  border:1px solid var(--line);position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 5px var(--ink2),inset 0 0 0 6px var(--chf,var(--line));
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  direction:rtl;text-align:center;transition:transform .12s}
body[dir="ltr"] .card{direction:ltr}
.card:active{transform:scale(.972)}
.card .glyph{margin-top:2px;line-height:0}
.card h3{font-size:16px;margin:0;line-height:1.45}
.card .meta{font-size:14px}
.card .bar{width:100%;height:2px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:8px}
.card .bar i{display:block;height:100%;background:var(--ch);transition:width .5s}
.card.mixed,.card.sp{background:linear-gradient(180deg,var(--warm),var(--ink2) 70%)}

/* ---------- الألواح المنزلقة ---------- */
.sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end}
.sheet>div{background:var(--ink);width:100%;max-height:90%;overflow-y:auto;
  border-radius:20px 20px 0 0;border-top:1px solid var(--line);
  padding:6px 18px calc(26px + env(safe-area-inset-bottom));
  animation:up .26s cubic-bezier(.2,.8,.3,1)}
@media (min-width:700px){.sheet{align-items:center;justify-content:center}
  .sheet>div{max-width:560px;border-radius:20px;border:1px solid var(--line);max-height:86%}}
@keyframes up{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;background:var(--line);border-radius:9px;margin:8px auto 14px}
.sheet h2{font-size:21px;margin:0 0 14px}
.sheet h3{font-size:15.5px;color:var(--muted);margin:24px 0 10px}
.sub{margin:-6px 0 14px}

/* أرقام الملف والتحليلات: جدول بخطوط فاصلة لا صناديق */
.grid2{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.kpi{padding:11px 2px;border-bottom:1px solid var(--line)}
.kpi:nth-child(odd){border-inline-end:1px solid var(--line);padding-inline-end:12px}
.kpi:nth-child(even){padding-inline-start:14px}
.kpi b{font-family:var(--display);font-size:24px;font-weight:600;display:block;line-height:1.3}
.kpi span{font-size:14.5px;color:var(--muted)}

.row{display:flex;align-items:center;gap:11px;padding:8px 0}
.row .nm{flex:1;font-size:15.5px;min-width:0}
.row .bar{flex:1.15;height:5px;background:var(--track);border-radius:4px;overflow:hidden}
.row .bar i{display:block;height:100%;border-radius:4px}
.row .pc{width:46px;text-align:end;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px 8px}
.badge{padding:10px 4px;text-align:center;opacity:.34}
.badge.on{opacity:1}
.badge b{display:block;font-family:var(--display);font-size:13.5px;font-weight:500;margin-top:6px;line-height:1.35}
.badge span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}

.chal{padding:12px 0;border-bottom:1px solid var(--line)}
.chal .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.chal b{font-family:var(--display);font-size:15.5px;font-weight:500}
.chal .n{font-size:14px;color:var(--brass);font-variant-numeric:tabular-nums;flex:none}
.chal p{margin:1px 0 8px;font-size:14px;color:var(--muted)}
.chal .bar{height:4px;background:var(--track);border-radius:4px;overflow:hidden}
.chal .bar i{display:block;height:100%;background:var(--fes);border-radius:4px;transition:width .4s}
.chal.done .bar i{background:var(--brass)}

table{width:100%;border-collapse:collapse;font-size:16px}
th{color:var(--muted);font-weight:400;font-size:14px;text-align:start;padding:0 6px 9px}
th:last-child,td:last-child{text-align:end}
td{padding:10px 6px;border-top:1px solid var(--line);vertical-align:middle}
tr.me td{background:var(--brass-wash)}
.rk{font-family:var(--display);font-size:16px;width:34px;color:var(--muted)}
tr.me .rk,.rk.top{color:var(--brass)}
td.p{font-family:var(--display);font-variant-numeric:tabular-nums;color:var(--brass);font-weight:600}
.empty{text-align:center;color:var(--muted);font-size:15.5px;padding:26px 10px;line-height:1.8}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.hs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips.hs::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:15px;color:var(--muted);background:transparent}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass);background:var(--brass-wash)}
/* صفوف القوائم: خط فاصل وعلامة لون الفرع، لا صناديق */
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:none;
  border:0;border-bottom:1px solid var(--line);padding:13px 2px;position:relative}
.li[style*="--ch"]{padding-inline-start:14px}
.li[style*="--ch"]::before{content:"";position:absolute;inset-inline-start:0;top:15px;bottom:15px;width:3px;border-radius:2px;background:var(--ch)}
.li .nm{flex:1;min-width:0;font-size:16.5px;line-height:1.5}
.li .nm small{display:block;color:var(--muted);font-size:14px;margin-top:1px}
.li .ct{font-size:14.5px;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.li>svg{width:19px;height:19px;stroke:var(--brass);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.jur{font-style:normal;font-size:12.5px;color:var(--fes);border:1px solid var(--fes-dim);border-radius:999px;padding:0 8px;margin-inline-start:6px;white-space:nowrap}
.newtag{font-size:12px;color:var(--on-brass);background:var(--brass);border-radius:5px;padding:0 7px;margin-inline-start:6px;font-family:var(--display);flex:none}
.back{color:var(--fes);font-size:15px;margin-bottom:8px;padding:4px 0}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.art{border:1px solid var(--line);border-radius:6px;padding:7px 4px;text-align:center;font-family:var(--display);font-size:14.5px;line-height:1.3}
.art small{display:block;color:var(--muted);font-family:var(--body);font-size:12.5px;margin-top:2px}
.art.done{border-color:var(--brass-dim);background:var(--brass-wash)}
.art.done small{color:var(--brass)}
.ta{width:100%;min-height:86px;background:var(--ink2);border:1px solid var(--line);border-radius:10px;
  color:var(--jibs);font:inherit;font-size:15.5px;padding:10px 12px;resize:vertical}
.ta:focus{outline:none;border-color:var(--fes)}
.filein{font-size:14px;color:var(--muted);margin-bottom:9px;max-width:100%}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;text-align:center;font-size:21px;
  letter-spacing:1.5px;border:1px dashed var(--brass-dim);border-radius:8px;
  padding:14px;margin:14px 0 10px;user-select:all;-webkit-user-select:all;color:var(--brass)}
kbd{font-family:ui-monospace,monospace;font-size:12px;background:var(--ink3);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--jibs)}

/* خط زمني للمستجدات */
.tl{border-inline-start:2px solid var(--line);padding-inline-start:16px;margin-inline-start:5px}
.tli{position:relative;padding:0 0 18px}
.tli::before{content:"";position:absolute;inset-inline-start:-23px;top:6px;width:10px;height:10px;
  border-radius:50%;background:var(--fes-dim);border:2px solid var(--ink)}
.tli.new::before{background:var(--brass)}
.tli .d{font-size:14px;color:var(--muted);display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.tli b{font-family:var(--display);font-weight:500;font-size:16px;display:block;margin-top:2px}
.tli .by{font-size:14.5px;color:var(--fes);margin-top:1px}
.tli p{margin:3px 0 0;font-size:15.5px;color:var(--txt2);line-height:1.7}

/* التحليلات */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;direction:ltr}
.heat i{aspect-ratio:1;border-radius:2px;background:var(--ink3)}
.heat i.l1{background:rgba(211,163,78,.32)} .heat i.l2{background:rgba(211,163,78,.55)}
.heat i.l3{background:rgba(211,163,78,.78)} .heat i.l4{background:var(--brass)}
.boxes{display:flex;gap:8px;align-items:flex-end;height:120px}
.bx{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bx i{display:block;width:100%;max-width:44px;background:var(--fes);border-radius:4px 4px 1px 1px;min-height:3px}
.bx b{font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums}
.bx span{font-size:12.5px;color:var(--muted)}

/* ---------- نافذة السؤال ---------- */
#quiz{position:fixed;inset:0;z-index:40;background:var(--ink);
  display:flex;flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom))}
#quiz:focus{outline:none}
@media (min-width:760px){#quiz{padding-left:calc(50% - 360px);padding-right:calc(50% - 360px)}}
.qhead{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.qhead .x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.qhead .x svg{width:16px;height:16px;stroke:var(--muted);stroke-width:2;stroke-linecap:round;fill:none;stroke-linejoin:round}
.qhead .star.on svg{stroke:var(--brass);fill:var(--brass)}
.qhead .ti{flex:1;min-width:0}
.qhead b{font-family:var(--display);font-weight:500;font-size:16.5px;display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:3px;margin-top:4px}
.pips i{width:16px;height:3px;border-radius:2px;background:var(--ink3)}
.pips i.on{background:var(--ch,var(--brass))}
.qhead .ct{font-family:var(--display);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}

.qbody{flex:1;overflow-y:auto;padding-bottom:8px}
.qtools{display:flex;align-items:center;gap:7px;margin:2px 0 14px}
.qtools .sp{flex:1}
.tag{display:inline-block;font-size:13.5px;color:var(--fes);border:1px solid var(--fes-dim);border-radius:999px;padding:0 11px;line-height:1.75}
.tag.br{color:var(--muted);border-color:var(--line)}
.mini{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;flex:none}
.mini svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mini.on svg{stroke:var(--brass)}
.stem{font-size:calc(20px * var(--fz));line-height:1.85;margin:0 0 16px;font-weight:500}
.hint{font-size:14.5px;color:var(--muted);margin:-6px 0 14px}

.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;
  background:var(--ink2);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;margin-bottom:9px;transition:border-color .15s,background .15s,opacity .15s}
/* حرف الخيار داخل نجمة ثمانية (خاتم) */
.opt .ltr{font-family:var(--display);font-size:14.5px;width:32px;height:32px;flex:none;display:grid;place-items:center;
  color:var(--muted);background:var(--ink3);
  clip-path:polygon(50% 0,64.6% 14.6%,85.4% 14.6%,85.4% 35.4%,100% 50%,85.4% 64.6%,85.4% 85.4%,64.6% 85.4%,50% 100%,35.4% 85.4%,14.6% 85.4%,14.6% 64.6%,0 50%,14.6% 35.4%,14.6% 14.6%,35.4% 14.6%)}
.opt .tx{flex:1;font-size:calc(17.5px * var(--fz));line-height:1.7;min-width:0;padding-top:2px}
.opt[aria-pressed="true"]{border-color:var(--fes);background:var(--fes-wash)}
.opt[aria-pressed="true"] .ltr{background:var(--fes);color:var(--on-fes)}
.opt.ok{border-color:var(--brass);background:var(--brass-wash)}
.opt.ok .ltr{background:var(--brass);color:var(--on-brass)}
.opt.bad{border-color:var(--qirmiz);background:var(--qirmiz-wash)}
.opt.bad .ltr{background:var(--qirmiz);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--brass)}
.opt.dim{opacity:.9}
.opt .why{display:block;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);
  font-size:calc(15.5px * var(--fz));line-height:1.75;color:var(--txt2);font-weight:400}
.opt .why::before{font-weight:700;margin-inline-end:5px}
.opt .why.y::before{content:"✓";color:var(--brass)}
.opt .why.n::before{content:"✗";color:var(--qirmiz)}
.locked .opt{pointer-events:none}
.locked .aiCard .opt{pointer-events:auto}  /* السؤال التوأم يبقى قابلاً للإجابة تحت سؤال مُجاب عنه */

/* النتيجة: ختم رسمي يُطبع على التعليل */
.verdict{border-radius:var(--r);padding:14px 16px 12px;margin:16px 0 0;border:1px solid var(--line);background:var(--ink2)}
.vhead{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.vhead .v{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.35}
.verdict.win .vhead .v{color:var(--brass)}
.verdict.lose .vhead .v{color:var(--qirmiz)}
.verdict.info .vhead .v{color:var(--fes)}
.gain{font-family:var(--display);font-size:15px;color:var(--muted);margin-top:2px}
.stamp{flex:none;transform:rotate(-8deg);opacity:.93;filter:url(#ink)}
.stamp.anim{animation:press .36s cubic-bezier(.2,1.35,.4,1) both}
@keyframes press{0%{transform:scale(1.9) rotate(-26deg);opacity:0}55%{opacity:.93}100%{transform:scale(1) rotate(-8deg);opacity:.93}}
.verdict p{margin:0;font-size:calc(16.5px * var(--fz));line-height:1.85;color:var(--txt2)}
.verdict p.key{color:var(--jibs);font-weight:600;margin-bottom:8px}
.verdict details{margin-top:6px}
.verdict summary{cursor:pointer;color:var(--fes);font-size:15px;padding:4px 0}
.verdict details p{margin-top:6px}
.bonus{font-size:12.5px;color:var(--on-brass);background:var(--brass);border-radius:5px;padding:0 7px;vertical-align:middle}
.src{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}
.src b{color:var(--fes);font-weight:600}
.linkbtn{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;margin-top:8px;padding:4px 0}
.qfoot{padding-top:12px}
.qfoot .btn{max-width:none}
.score{display:flex;align-items:center;gap:18px;margin:4px 0 18px}

.xref{border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-bottom:12px}
.xref h4{margin:0 0 8px;font-size:16px;color:var(--brass)}
.xref table{width:100%;border-collapse:collapse;font-size:15px}
.xref td{padding:6px 8px;border-top:1px solid var(--line);vertical-align:top;text-align:start}
.xref tr:first-child td{border-top:none}
.xref td:first-child{color:var(--brass);font-weight:600;white-space:nowrap}
.pv{display:block;margin-top:7px;font-size:14px;font-weight:600}
.pv.v{color:var(--brass)}
.pv.m{color:#C89B5A}
.pv.r{color:var(--qirmiz)}
.srch{display:flex;align-items:center;gap:9px;margin:0 16px 12px;flex:none;
  border:1px solid var(--line);border-radius:12px;padding:0 12px;background:transparent}
.srch svg{width:17px;height:17px;flex:none;stroke:var(--muted);fill:none;stroke-width:2}
.srch input{flex:1;background:none;border:0;outline:0;color:var(--jibs);
  font-family:inherit;font-size:16px;padding:11px 0;min-width:0}
.srch input::placeholder{color:var(--muted)}
.srch .clr{color:var(--muted);font-size:22px;line-height:1;padding:0 2px}
#qres{margin:0 16px 14px;max-height:46vh;overflow-y:auto;flex:none;border:1px solid var(--line);border-radius:12px;padding:2px 14px;background:var(--ink2)}
#qres .cnt{font-size:14px;color:var(--muted);padding:10px 0 4px}
.hit{display:block;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);
  padding:11px 2px;padding-inline-start:14px;position:relative}
.hit:last-child{border-bottom:0}
.hit::before{content:"";position:absolute;inset-inline-start:0;top:13px;bottom:13px;width:3px;border-radius:2px;background:var(--ch,var(--brass))}
.hit .b{font-size:13.5px;color:var(--muted);display:block}
.hit .t{font-size:16px;line-height:1.6;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.timer{font-family:var(--display);font-size:16px;color:var(--brass);font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:1px}
.timer.low{color:var(--qirmiz)}
.res{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:start;background:none;
  border:0;border-bottom:1px solid var(--line);padding:11px 2px;padding-inline-start:14px;position:relative}
.res::before{content:"";position:absolute;inset-inline-start:0;top:13px;bottom:13px;width:3px;border-radius:2px;background:var(--line)}
.res.ok::before{background:var(--brass)} .res.bad::before{background:var(--qirmiz)}
.res.skip{opacity:.8}
.res .rn{font-family:var(--display);font-size:14px;color:var(--muted);width:22px;flex:none}
.res .rt{flex:1;font-size:16px;line-height:1.6;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.res .rm{flex:none;font-size:15px}
.res.ok .rm{color:var(--brass)} .res.bad .rm{color:var(--qirmiz)}
.resx{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 10px}
.resx p{margin:0;font-size:calc(15.5px * var(--fz));line-height:1.8;color:var(--txt2)}
.banner{border:1px solid var(--qirmiz);color:var(--qirmiz);border-radius:10px;padding:9px 12px;margin-bottom:14px;font-size:15.5px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--adh,0px) + env(safe-area-inset-bottom));z-index:70;
  width:max-content;max-width:min(92vw,460px);box-sizing:border-box;text-align:center;background:var(--brass);color:var(--on-brass);font-family:var(--display);
  font-size:14.5px;font-weight:500;padding:10px 20px;border-radius:999px;animation:toastUp .26s;pointer-events:none}
@keyframes toastUp{from{transform:translate(-50%,26px);opacity:0}to{transform:translateX(-50%);opacity:1}}

/* الجولة التعريفية */
.onb{text-align:center;padding:4px 2px 2px}
.onb .ill{margin:4px auto 14px;width:96px;line-height:0}
.onb h2{margin-bottom:8px}
.onb p{color:var(--txt2);font-size:17px;line-height:1.85;margin:0 auto 18px;max-width:40ch}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--line);transition:width .2s}
.dots i.on{background:var(--brass);width:20px}

/* ---------- السحابة: الحضور الحي والإعلان والنبض والغرف ---------- */
.onl{display:inline-flex;align-items:center;gap:5px;margin-inline-start:10px;color:var(--fes);white-space:nowrap;
  font-family:var(--display);font-size:13.5px;font-variant-numeric:tabular-nums}
.onl i,.sd.wait{width:7px;height:7px;border-radius:50%;background:var(--fes);animation:beat 2.4s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 var(--fes-wash)}50%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.annc{display:flex;align-items:flex-start;gap:10px;margin:2px 16px 12px;padding:10px 12px;border:1px solid var(--fes-dim);
  border-radius:8px;background:var(--fes-wash);font-size:15.5px;line-height:1.7;position:relative;z-index:1;flex:none}
.annc b{font-family:var(--display);font-weight:500;color:var(--fes);flex:none}
.annc span{flex:1;min-width:0}
.annc a{color:var(--fes);flex:none;font-size:14.5px}
.annc .x{flex:none;width:26px;height:26px;border-radius:7px;color:var(--muted);font-size:19px;line-height:1;margin-top:1px}
.annc.consent{flex-wrap:wrap;border-color:var(--line);background:var(--ink2);font-size:14.5px;color:var(--txt2);line-height:1.75}
.annc.consent span:first-child{flex:1 1 240px}
.annc .cb{display:flex;gap:7px;flex:none;margin-inline-start:auto}
.annc .cb .btn,.annc .cb .btn2{width:auto;padding:6px 14px;font-size:14px;border-radius:9px}
.decree .dst{display:block;margin-top:5px;font-size:13.5px;color:var(--fes);font-family:var(--display);font-weight:400}
.rivals{display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}
.rivals::-webkit-scrollbar{display:none}
.rivals .rl{font-size:13px;color:var(--muted);flex:none}
.rv{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;
  padding:2px 10px 2px 3px;font-size:14px;line-height:1.5}
.rv svg{flex:none}
.rv em{font-style:normal;font-family:var(--display);color:var(--muted);font-variant-numeric:tabular-nums}
.rv.done{border-color:var(--brass-dim)} .rv.done em{color:var(--brass)}
.acct{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.acct b{font-family:var(--display);font-size:18px;font-weight:500;display:block;line-height:1.4}
.acct small{color:var(--muted);font-size:13.5px;line-height:1.6;display:block}
.svc{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.svc .nm{flex:1;min-width:0}
.svc .nm b{font-family:var(--display);font-weight:500;font-size:15.5px;display:block}
.svc .nm small{display:block;color:var(--muted);font-size:13.5px;line-height:1.6}
.svc .nm small.er{color:var(--qirmiz);word-break:break-word}
.svc .ct{font-size:13.5px;color:var(--muted);flex:none}
.sd{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.sd.ok{background:var(--fes)} .sd.err{background:var(--qirmiz)} .sd.wait{background:var(--brass)}
.btn2.danger{color:var(--qirmiz)}
.sheet a{color:var(--fes)}

/* ---------- الدخول بـ Google ---------- */
.or{display:flex;align-items:center;gap:12px;width:100%;max-width:340px;color:var(--muted);font-size:14px;margin:-6px 0}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{width:100%;max-width:340px;display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 20px;border-radius:var(--r);font-size:16px}
.gbtn svg{width:18px;height:18px;stroke:var(--brass);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.glink{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:4px 0 6px;display:flex;align-items:center;gap:12px}
.glink>svg{width:24px;height:24px;flex:none;stroke:var(--brass);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.glink .nm{flex:1;min-width:0;font-size:14.5px;color:var(--txt2);line-height:1.7}
.glink .nm b{display:block;font-family:var(--display);font-weight:500;color:var(--jibs);font-size:15.5px}

/* ---------- الترتيب العالمي ---------- */
.hall{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:2px 0 10px}
.hall::-webkit-scrollbar{display:none}
.hall .hl{flex:none;font-size:13px;color:var(--muted);align-self:center}
.hall .hm{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 4px;font-size:14px}
.medal{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:12px;font-weight:700;flex:none;color:#1B1305}
.medal.m1{background:#D9B45A} .medal.m2{background:#B9C2C9} .medal.m3{background:#C38B5F}
td.rk .medal{margin:0 auto}
.myrank{border:1px solid var(--brass-dim);background:var(--brass-wash);border-radius:12px;padding:12px 14px;margin:12px 0 4px}
.myrank .mt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.myrank .mt b{font-family:var(--display);font-size:26px;color:var(--brass);font-variant-numeric:tabular-nums;line-height:1.2}
.myrank .mt span{color:var(--txt2);font-size:14.5px}
.delta{font-family:var(--display);font-size:13px;margin-inline-start:6px}
.delta.up{color:var(--fes)} .delta.dn{color:var(--qirmiz)}
.near{margin-top:8px} .near td{padding:6px 6px;font-size:15px}
.chips.hs .chip{flex:none}

/* ---------- المساعد ---------- */
.aiRow{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.aib{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--fes-dim);color:var(--fes);border-radius:999px;padding:5px 13px;font-size:14.5px;font-family:var(--display)}
.aib svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.aiCard{border:1px solid var(--fes-dim);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--fes-wash);font-size:calc(16px * var(--fz));line-height:1.85;color:var(--txt2)}
.aiCard h4{margin:0 0 6px;font-family:var(--display);font-weight:500;color:var(--jibs);font-size:16.5px}
.aiCard p{margin:6px 0}
.aiCard .box{border-inline-start:3px solid var(--brass);padding:4px 10px;margin:8px 0;background:var(--brass-wash);border-radius:4px;color:var(--jibs)}
.aiCard .lbl{font-family:var(--display);font-size:13px;color:var(--muted);display:block;margin-top:8px}
.aiCard ul{margin:4px 0;padding-inline-start:20px}
.aiCard .ol{display:flex;gap:8px;align-items:flex-start;margin:5px 0}
.aiCard .ol i{font-style:normal;font-family:var(--display);flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;border:1px solid var(--line)}
.aiCard .ol i.y{background:var(--fes);color:var(--on-fes);border-color:var(--fes)} .aiCard .ol i.n{color:var(--qirmiz);border-color:var(--qirmiz)}
.aiCard .meta2{font-size:12.5px;color:var(--muted);margin-top:8px}
.aiCard .warn{color:var(--qirmiz);font-size:13px}
.aiCard .cites{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.aiCard .cites button{font-family:ui-monospace,monospace;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--fes);direction:ltr}
.shim{height:12px;border-radius:6px;margin:8px 0;background:linear-gradient(90deg,var(--ink3),var(--fes-wash),var(--ink3));background-size:200% 100%;animation:shim 1.4s infinite}
@keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}
.tq .opt{padding:9px 12px;margin:5px 0}
.ring{width:84px;height:84px;flex:none}
.ring circle{fill:none;stroke-width:7}
.ring .rb{stroke:var(--ink3)} .ring .rf{stroke:var(--brass);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring text{font-family:var(--display);fill:var(--jibs);font-size:22px;font-weight:600}
.crit{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px;flex:1}
.crit .bar{height:6px;border-radius:3px;background:var(--ink3);overflow:hidden}
.crit .bar i{display:block;height:100%;background:var(--fes)}
.pday{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.pday h4{margin:0 0 4px;font-family:var(--display);font-weight:500;font-size:15.5px;display:flex;gap:8px;align-items:baseline}
.pday h4 small{color:var(--muted);font-size:13px;font-weight:400}
.pstep{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.6}
.pstep:first-of-type{border-top:0}
.pstep .nm{flex:1;min-width:0;color:var(--txt2)} .pstep .nm b{color:var(--jibs);font-weight:500}
.pstep .aib{padding:3px 11px;font-size:13.5px}
.aiCard details.art{border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--ink2,transparent)}
.aiCard details.art>summary{cursor:pointer;padding:7px 11px;font-size:14.5px;color:var(--jibs);list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.aiCard details.art>summary::-webkit-details-marker{display:none}
.aiCard details.art>summary::before{content:'▸';color:var(--brass);font-size:12px;transition:transform .15s}
.aiCard details.art[open]>summary::before{transform:rotate(90deg)}
[dir=rtl] .aiCard details.art>summary::before{content:'◂'}
[dir=rtl] .aiCard details.art[open]>summary::before{transform:rotate(-90deg)}
.aiCard details.art>summary b{font-family:var(--display);font-weight:500;color:var(--brass)}
.aiCard details.art .ap{font-size:12.5px;color:var(--muted);padding:0 11px}
.aiCard details.art .at{padding:4px 11px 8px;white-space:pre-line;color:var(--jibs);font-size:calc(15.5px * var(--fz));line-height:1.9}
.aiCard details.art .an{padding:0 11px 8px;font-size:12.5px;color:var(--muted)}
.aiCard details.art .warn{padding:0 11px 8px;margin:0}
.aiCard .ak{font-family:var(--display);font-size:13px;border:1px solid var(--brass);color:var(--brass);border-radius:6px;padding:0 6px;margin:0 2px;white-space:nowrap}
.aiCard .issue{border-top:1px solid var(--line);padding-top:6px;margin-top:8px}
.aiCard .issue:first-of-type{border-top:0}
.aiCard .disc{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 10px;margin-top:8px}
.aiq{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.aiq .ta{min-height:64px}
.quota{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:-6px 0 12px}
.quota a,.quota button.lk{color:var(--fes);font-size:13px;text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

/* ---------- التخزين: مخزن المنصة ← الجسر الأصلي ← ذاكرة المتصفح ← الذاكرة المؤقتة ---------- */
const mem = new Map();
const LS = (()=>{ try{ const k='__qt'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return localStorage; }catch(e){ return null; } })();
const lsk = (k,sh) => 'qt:'+(sh?'s:':'')+k;
const Store = {
  async get(k, sh=false){
    try{
      if(window.storage){ const r = await window.storage.get(k, sh); return r ? JSON.parse(r.value) : null; }
      if(window.QT_NATIVE){ const v = await window.QT_NATIVE.get(k); return v ? JSON.parse(v) : null; }
      if(LS){ const v = LS.getItem(lsk(k,sh)); if(v!=null) return JSON.parse(v); }
    }catch(e){}
    return mem.get((sh?'s:':'')+k) ?? null;
  },
  async set(k, v, sh=false){
    const s = JSON.stringify(v);
    mem.set((sh?'s:':'')+k, v);
    try{
      if(window.storage) return await window.storage.set(k, s, sh);
      if(window.QT_NATIVE) return await window.QT_NATIVE.set(k, s);
      if(LS) LS.setItem(lsk(k,sh), s);
    }catch(e){}
  },
  async list(pre, sh=false){
    try{
      if(window.storage){ const r = await window.storage.list(pre, sh); return r ? r.keys : []; }
      if(!window.QT_NATIVE && LS){
        const P = lsk(pre,sh), cut = lsk('',sh).length, out=[];
        for(let i=0;i<LS.length;i++){ const k=LS.key(i); if(k && k.startsWith(P)) out.push(k.slice(cut)); }
        return out;
      }
    }catch(e){}
    return [...mem.keys()].filter(k=>k.startsWith((sh?'s:':'')+pre)).map(k=>k.replace(/^s:/,''));
  }
};

/* ---------- التواريخ ---------- */
const z2 = n => String(n).padStart(2,'0');
function today(d=new Date()){ return d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate()); }
function dnum(d=new Date()){ return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5); }
function weekKey(d=new Date()){
  const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())), day=x.getUTCDay()||7;
  x.setUTCDate(x.getUTCDate()+4-day);
  const y=x.getUTCFullYear(), w=Math.ceil(((x-Date.UTC(y,0,1))/864e5+1)/7);
  return y+'-W'+z2(w);
}
function fmtDate(s){
  const m=String(s||'').match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/);
  if(!m) return esc(s||'');
  return (m[3]?(+m[3])+' ':'')+MONTHS[S.lang][+m[2]-1]+' '+m[1];
}
function fmtSecs(v){ v=Math.max(0,Math.round(v)); const h=Math.floor(v/3600), m=Math.floor(v%3600/60), s=v%60;
  return (h?h+':'+z2(m):z2(m))+':'+z2(s); }
function dayStreak(p=S.p){
  const days=(p&&p.days)||{}; const d=new Date();
  if(!days[today(d)]) d.setDate(d.getDate()-1);
  let n=0; while(days[today(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
// مولّد عشوائي ببذرة: يُخرج المتسلسلة نفسها على كل جهاز، وعليه يقوم «تحدَّ صديقاً»
function rng(seed){ return ()=>{ seed=(seed+0x6D2B79F5)|0; let x=Math.imul(seed^seed>>>15,1|seed);
  x=(x+Math.imul(x^x>>>7,61|x))^x; return ((x^x>>>14)>>>0)/4294967296; }; }

/* ---------- الخاتم الهندسي ---------- */
function starPath(cx,cy,R,r,pts,rot){
  let d='';
  for(let i=0;i<pts*2;i++){
    const rad=i%2?r:R, a=rot+i*Math.PI/pts;
    d+=(i?'L':'M')+(cx+rad*Math.cos(a)).toFixed(1)+' '+(cy+rad*Math.sin(a)).toFixed(1);
  }
  return d+'Z';
}
function seal(seed, size, col){
  const p = 8+(seed%3)*2, c=size/2, R=c*.94, r=R*(.5+(seed%5)*.045);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <path d="${starPath(c,c,R,r,p,0)}" fill="none" stroke="${col}" stroke-width="${size*.032}" stroke-linejoin="round" opacity=".95"/>
    <path d="${starPath(c,c,R*.72,r*.72,p,Math.PI/p)}" fill="none" stroke="${col}" stroke-width="${size*.022}" stroke-linejoin="round" opacity=".62"/>
    <circle cx="${c}" cy="${c}" r="${R*.3}" fill="none" stroke="${col}" stroke-width="${size*.022}" opacity=".85"/>
    <circle cx="${c}" cy="${c}" r="${R*.11}" fill="${col}" opacity=".9"/>
  </svg>`;
}
const hue = h => document.documentElement.dataset.theme==='light' ? `hsl(${h} 48% 40%)` : `hsl(${h} 52% 58%)`;
const hueA = (h,a) => document.documentElement.dataset.theme==='light' ? `hsl(${h} 48% 40% / ${a})` : `hsl(${h} 52% 58% / ${a})`;

/* ---------- وردة التمكّن: بتلة لكل فرع تمتلئ بلونه، ونجمة ثمانية في القلب تحمل النقاط ---------- */
function rosette(size){
  const br=BANK.branches, n=br.length, c=size/2, R=c-2, r0=c*.42, step=2*Math.PI/n;
  const seenBy={}; for(const id in S.p.seen){ const q=IDX[id]; if(q) seenBy[q.branch]=(seenBy[q.branch]||0)+1; }
  const P=(r,a)=>(c+r*Math.cos(a)).toFixed(1)+','+(c+r*Math.sin(a)).toFixed(1);
  const kite=(r1,a0,a1)=>{ const am=(a0+a1)/2, rm=r0+(r1-r0)*.5; return `${P(r0,am)} ${P(rm,a0)} ${P(r1,am)} ${P(rm,a1)}`; };
  const petals=br.map((b,i)=>{
    const tot=BCOUNT[b.id]||1, s=seenBy[b.id]||0, f=Math.sqrt(Math.min(1,s/tot));
    const a0=-Math.PI/2+i*step+step*.07, a1=a0+step*.86;
    return `<g class="pt" data-b="${b.id}" tabindex="0" role="button" aria-label="${esc(bName(b))}: ${s}/${tot}"><title>${esc(bName(b))}: ${s}/${tot}</title>
      <polygon class="po" points="${kite(R,a0,a1)}"/>${s?`<polygon class="pf" style="fill:${hue(b.hue)}" points="${kite(r0+(R-r0)*Math.max(.14,f),a0,a1)}"/>`:''}</g>`;
  }).join('');
  const pts=S.p.points;
  return `<svg class="rosette" viewBox="0 0 ${size} ${size}" role="group" aria-label="${esc(t('mastery'))}">${petals}
    <path class="core" d="${starPath(c,c,r0*.94,r0*.94*.7654,8,-Math.PI/2)}"/>
    <text class="pts" x="${c}" y="${c+4}" text-anchor="middle" font-size="${pts>99999?15:pts>9999?18:22}">${pts}</text>
    <text class="ptl" x="${c}" y="${c+20}" text-anchor="middle" font-size="12">${esc(t('pts'))}</text></svg>`;
}

function indexBank(){

// مفتاح القانون: يوحّد صيغ الاسم المختلفة للنص الواحد عبر سجل النصوص، ويفصل الاجتهاد عن النص
function lawGroupKey(q){
  const law=q.source.law||'', li=LAWOF[law], jur=/^اجتهاد/.test(law);
  return (jur?'J':'L')+'|'+(li!=null?'R'+li:law);
}
function lawTitle(k){
  const j=k[0]==='J', rest=k.slice(2);
  const base = /^R\d+$/.test(rest) && LAWS[+rest.slice(1)] ? LAWS[+rest.slice(1)].n
             : rest.replace(/^اجتهاد محكمة النقض\s*[—–-]\s*/,'');
  return base;
}
function lawLabel(l){ return /^\d/.test(l) ? t('lawW')+' '+l : l; }
function artsOf(q){
  let r=String(q.source.ref||'').replace(/املادة/g,'المادة');
  const m=r.match(/(?:المادت|المادة|المواد|الفصل|الفصول)/);
  if(!m) return [];
  r=r.slice(m.index).replace(/\d+\.\d+/g,' ').replace(/الأولى|الاولى/g,'1');
  const cut=r.search(/\s(?:بتاريخ|عدد|ظهير)\s|[—(«]/);
  if(cut>0) r=r.slice(0,cut);
  const nums=r.match(/\d+(?:-\d+)?(?:\s*مكرر(?:\s*(?:مرتين|ثلاث مرات))?)?/g)||[];
  return [...new Set(nums.map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>parseInt(x,10)<1500))].slice(0,4);
}
function artKey(a){
  const m=String(a).match(/^(\d+)(?:-(\d+))?/);
  const b=/مرتين/.test(a)?2:(/ثلاث/.test(a)?3:(/مكرر/.test(a)?1:0));
  return m?[+m[1], m[2]?+m[2]:0, b]:[1e9,0,0];
}
const artCmp=(x,y)=>{ const a=artKey(x), b=artKey(y); return a[0]-b[0]||a[1]-b[1]||a[2]-b[2]; };
function libIndex(){
  if(LIB) return LIB;
  LIB={};
  for(const q of BANK.questions){
    const key=lawGroupKey(q), br=LIB[q.branch]||(LIB[q.branch]={});
    let g=br[key];
    if(!g) g=br[key]={ key, li: key.slice(2)[0]==='R' && /^R\d+$/.test(key.slice(2)) ? +key.slice(3) : null,
                       jur:key[0]==='J', name:lawTitle(key), qs:[], arts:{} };
    g.qs.push(q);
    const a=artsOf(q); (a.length?a:['—']).forEach(k=>{ (g.arts[k]=g.arts[k]||[]).push(q); });
  }
  return LIB;
}

/* ---------- تفكيك الفخ: نسبة كل جملة من التعليل إلى الخيار الذي تتكلم عنه ---------- */
function splitEx(q){
  const e=q.explain||'', m=e.match(/^\*\*(.+?)\*\*\s*:?\s*/);
  const key = m ? m[1] : '', body = m ? e.slice(m[0].length) : e;
  return { key, body, why: parseWhy(body, q) };
}
// يقسم التعليل جملاً، ويلتقط في كل جملة علامات «(أ)» و«(ب خطأ)». لا تُنسب الجملة إلى خيار
// إلا إذا طابق وصفها (صحيح/خطأ) الجوابَ المعتمد، حتى لا يُعرض تعليل في غير موضعه.
function parseWhy(body, q){
  const cor=new Set(q.correct), out={};
  const add=(i,s)=>{ s=s.trim(); if(s) (out[i]=out[i]||[]).push(s); };
  const sents=body.replace(/([.؛!؟])\s+/g,'$1\u0001').split('\u0001');
  for(const s of sents){
    const re=/\(([أبجد])( خطأ| صحيح)?\)/g, ms=[]; let m;
    while((m=re.exec(s))) ms.push({ i:LTR.indexOf(m[1]), ok:m[2]!==' خطأ', at:m.index, end:m.index+m[0].length });
    if(!ms.length) continue;
    // أسلوبان في الكتابة: علامة في صدر الجملة يتلوها سببها «ويكون (ب خطأ) لأن…» فتُقطّع الجملة عند كل علامة،
    // أو علامات بعد العبارات التي تخصها «… (ب)، و… (ج).» فتُنسب الجملة كاملة إلى كل علامة فيها.
    const lead=s.slice(0,ms[0].at).replace(/(?:ويكون|وكذلك|و|ف|أما|بينما)\s*$/,'').trim();
    if(lead.length>2 || ms.length===1){ ms.forEach(x=>{ if(x.ok===cor.has(x.i)) add(x.i,s); }); continue; }
    const groups=[];
    ms.forEach(x=>{ const g=groups[groups.length-1];
      if(g && x.at-g.end<=6 && x.ok===g.items[0].ok){ g.items.push(x); g.end=x.end; }
      else groups.push({ items:[x], at:x.at, end:x.end }); });
    const startOf=g=>{ const pre=s.slice(Math.max(0,g.at-8),g.at).match(/(?:ويكون|وكذلك|و|ف)\s*$/); return g.at-(pre?pre[0].length:0); };
    groups.forEach((g,k)=>{
      const seg=s.slice(startOf(g), k+1<groups.length?startOf(groups[k+1]):s.length);
      g.items.forEach(x=>{ if(x.ok===cor.has(x.i)) add(x.i,seg); });
    });
  }
  // لا تُعرض شظية لا تزيد على تكرار العلامة («فـ(د) صحيح.»)
  const res={};
  for(const k in out){
    const txt=[...new Set(out[k])].join(' ');
    if(txt.replace(/\([أبجد](?: خطأ| صحيح)?\)/g,'').replace(/[^\p{L}\p{N}]+/gu,'').replace(/^(?:فالصحيح|فـ?|صحيح|خطأ|إذن)+|(?:صحيح|خطأ)$/g,'').length>=12) res[k]=txt;
  }
  return res;
}
const cleanWhy = s => s.replace(/^\s*(?:ويكون|وكذلك|و|ف)?\s*(?:\([أبجد](?: خطأ| صحيح)?\)\s*(?:و\s*)?)+[:،]?\s*/,'').replace(/[،,]\s*$/,'').trim();

// الامتحان يسحب من المُثبَّت فقط: محاكاة المباراة لا تُبنى على سؤال يحتاج تدقيقاً
function examQueue(n=20){
  const pool = BANK.questions.filter(q=>q.conf!=='r');
  const pick=[], plan=[[1,3],[2,4],[3,7],[4,4],[5,2]];
  plan.forEach(([d,k])=>{
    const a=shuffle(pool.filter(q=>q.difficulty===d));
    pick.push(...a.slice(0,k));
  });
  while(pick.length<n && pick.length<pool.length){
    const q=pool[Math.floor(Math.random()*pool.length)];
    if(!pick.includes(q)) pick.push(q);
  }
  return pick.slice(0,n).sort((a,b)=>a.difficulty-b.difficulty);
}

// البحث: يطابق نص السؤال وتعليله ومرجعه، ويعيد استعمال محرّك الأسئلة نفسه
const norm = t => (t||'').replace(/[\u064B-\u0652\u0640]/g,'')
  .replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
// شارة المصدر: يجب أن يعرف المترشح هل السؤال مقروء في نص رسمي أم مكتوب من الذاكرة.
// إخفاء هذا الفرق يجعل كل الأسئلة تبدو متساوية الوثوق وهي ليست كذلك.
function prov(q){
  if(q.conf==='r') return `<span class="pv r" dir="auto">⚠ ${t('confR')}</span>`;
  if(q.src==='text') return `<span class="pv v" dir="auto">✓ ${t('srcText')}</span>`;
  if(q.src==='bo')   return `<span class="pv v" dir="auto">✓ ${t('srcBo')}</span>`;
  return `<span class="pv m" dir="auto">○ ${t('srcMem')}</span>`;
}

function searchBank(term){
  const w = norm(term).trim().split(/\s+/).filter(x=>x.length>1);
  if(!w.length) return [];
  return BANK.questions.filter(q=>{
    const hay = norm(q.stem+' '+q.explain+' '+q.source.law+' '+q.source.ref+' '+q.options.join(' '));
    return w.every(x=>hay.includes(x));
  }).slice(0,60);
}
function paintSearch(){
  const term=$('#q').value, res=$('#qres'), box=$('#qx2');
  box.classList.toggle('hidden', !term);
  if(!term.trim()){ res.classList.add('hidden'); res.innerHTML=''; return; }
  const hits=searchBank(term);
  res.classList.remove('hidden');
  if(!hits.length){ res.innerHTML=`<div class="cnt">${t('noRes')}</div>`; return; }
  res.innerHTML=`<div class="cnt">${hits.length}${hits.length===60?'+':''} ${t('found')}</div>`+hits.map((q,i)=>hitHTML(q,i)).join('');
  res.querySelectorAll('.hit').forEach(el=>el.onclick=()=>
    startSess({ bid:'search', mode:'practice', queue:hits.slice(+el.dataset.i) }));
}
function hitHTML(q,i){
  const b=byId(q.branch);
  return `<button class="hit" data-i="${i}" style="--ch:${hue(b.hue)}">
    <span class="b">${esc(bName(b))}، ${esc(q.source.ref)}</span>
    <span class="t" dir="rtl">${esc(q.stem)}</span></button>`;
}

/* ---------- شريط الفروع: حلقة رسم واحدة ومستمعات تُركَّب مرة واحدة ---------- */
let rx=0, rw=0, rPaused=false, rDrag=null, tmr=null, railOn=false;
function buildRail(){
  const wrongN = Object.keys(S.p.wrong||{}).length;
  const cards = specialCard('exam') + (wrongN?specialCard('wrong'):'')
              + BANK.branches.map(cardHTML).join('') + cardHTML(null);
  const tr=$('#track'); tr.innerHTML = cards + cards;
  requestAnimationFrame(()=>{ rw = tr.scrollWidth/2; });
  if(railOn) return; railOn=true;
  tr.onclick = e=>{ const c=e.target.closest('.card'); if(c && !rDrag) openQuiz(c.dataset.b); };
  const down = x=>{ rDrag={x0:x,r0:rx,moved:false}; tr.classList.add('drag'); };
  const move = x=>{ if(!rDrag)return; const dx=x-rDrag.x0; if(Math.abs(dx)>5)rDrag.moved=true; rx=rDrag.r0-dx; };
  const up = ()=>{ tr.classList.remove('drag'); const m=rDrag&&rDrag.moved; setTimeout(()=>rDrag=null,m?60:0); if(!m)rDrag=null; };
  tr.addEventListener('pointerdown',e=>down(e.clientX));
  window.addEventListener('pointermove',e=>move(e.clientX));
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
  window.addEventListener('resize',()=>{ rw=tr.scrollWidth/2; });
  tr.addEventListener('mouseenter',()=>rPaused=true);
  tr.addEventListener('mouseleave',()=>rPaused=false);
  loop();
}
const slow = matchMedia('(prefers-reduced-motion:reduce)').matches;
function loop(){
  if(rw && $('#quiz').classList.contains('hidden')){
    if(!rPaused && !rDrag && !slow && S.cfg.motion) rx += .32;
    rx = ((rx % rw)+rw)%rw;
    $('#track').style.transform = `translateX(${-rx}px)`;
  }
  requestAnimationFrame(loop);
}

/* ---------- الأسئلة: من الأسهل إلى الأصعب ---------- */
function queueFor(bid){
  if(bid==='wrong'){
    const w = S.p.wrong||{};
    return BANK.questions.filter(q=>w[q.id]).sort((a,b)=>a.difficulty-b.difficulty);
  }
  const pool = bid==='mixed' ? BANK.questions : BANK.questions.filter(q=>q.branch===bid);
  const fresh = pool.filter(q=>!S.p.seen[q.id]);
  const list  = fresh.length ? fresh : pool;
  return list.slice().sort((a,b)=> a.difficulty-b.difficulty || a.id.localeCompare(b.id));
}
const byDiff = (a,b)=> a.difficulty-b.difficulty || (a.id<b.id?-1:1);

function startSess(o){
  if(!o.queue || !o.queue.length) return toast(t('sessDone'));
  S.sess = Object.assign({ i:0, answers:[], t0:Date.now(), mode:'practice', title:null }, o);
  serve();
}
function openQuiz(bid){
  if(bid==='exam'){
    const eq = examQueue(20);
    if(!eq.length) return toast(t('done'));
    return startSess({ bid:'exam', mode:'exam', queue:eq, title:t('exam') });
  }
  const q = queueFor(bid);
  if(!q.length) return toast(bid==='wrong'?t('noMist'):t('done'));
  startSess({ bid, mode:'practice', queue:q,
              title: bid==='wrong'?t('review'):(bid==='mixed'?t('mixed'):null) });
}
function endMsg(s){ return (s.bid==='wrong'||s.bid==='due') ? t('noMist') : (byId(s.bid) ? t('done') : t('sessDone')); }

const HAS_TTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
function hush(){ try{ if(HAS_TTS) speechSynthesis.cancel(); }catch(e){} }

function serve(){
  const s=S.sess; if(!s) return;
  hush();
  if(s.i>=s.queue.length){
    if(s.mode==='exam') return showResults(false);
    closeQuiz(); toast(endMsg(s)); adsBreak(s); return;
  }
  if(s.i<0) s.i=0;
  const q=s.queue[s.i], b=byId(q.branch), col=hue(b.hue), lt=lts();
  const typ = {knowledge:'tk',case:'tc',problem:'tp'}[q.type]||'tk';
  const isEx=s.mode==='exam', isSt=s.mode==='study';
  const title = s.title || bName(b);
  $('#quiz').style.setProperty('--ch',col);
  $('#quiz').className='';
  $('#quiz').innerHTML=`
    <div class="qhead">
      <button class="x" id="qx" aria-label="${t('back')}">${ICO.x}</button>
      <div class="ti"><b>${esc(title)}</b>
        ${isEx ? `<div class="timer" id="tmr">${s.limit?fmtSecs(s.limit):'00:00'}</div>`
               : `<div class="pips">${[1,2,3,4,5].map(i=>`<i class="${i<=q.difficulty?'on':''}"></i>`).join('')}</div>`}
      </div>
      <div class="ct">${s.i+1}/${s.queue.length}</div>
      <button class="x star${S.p.bm[q.id]?' on':''}" id="qbm" aria-label="${t('bmT')}" aria-pressed="${!!S.p.bm[q.id]}">${ICO.star}</button>
    </div>
    ${s.bid==='duel'?'<div class="rivals hidden" id="rivals" aria-live="polite"></div>':''}
    <div class="qbody" dir="rtl">
      <div class="qtools"><span class="tag">${t(typ)}</span>${title!==bName(b)?`<span class="tag br">${esc(bName(b))}</span>`:''}<span class="sp"></span>
        ${HAS_TTS?`<button class="mini" id="qsp" aria-label="${t('listen')}">${ICO.speak}</button>`:''}
        ${isEx?'':`<button class="mini" id="qsh" aria-label="${t('share')}">${ICO.share}</button>`}</div>
      <p class="stem">${md(q.stem)}</p>
      ${isSt?'':`<p class="hint" dir="auto">${t('multi')}</p>`}
      <div id="opts">${q.options.map((o,i)=>
        `<button class="opt" data-i="${i}" aria-pressed="false">
           <span class="ltr">${lt[i]}</span><span class="tx">${md(o)}</span></button>`).join('')}</div>
      <div id="verdict"></div>
    </div>
    <div class="qfoot">${isSt
      ? `<div class="duo"><button class="btn2" id="qprev"${s.i?'':' disabled'}>${t('prev')}</button><button class="btn" id="go">${s.i+1<s.queue.length?t('next'):t('finish')}</button></div>`
      : `<button class="btn" id="go"></button>`}</div>`;
  $('#qx').onclick=closeQuiz;
  $('#qbm').onclick=()=>toggleBm(q);
  if($('#qsp')) $('#qsp').onclick=()=>speakQ(q);
  if($('#qsh')) $('#qsh').onclick=()=>shareQ(q);
  $('#quiz').classList.remove('hidden');
  if(s.bid==='duel') paintRivals();
  // يُنقل التركيز إلى نافذة السؤال: وإلا بقي على حقل البحث أو على بطاقة الفرع خلفها،
  // فتتعطل الاختصارات ويعيد Enter فتح البطاقة بدل تأكيد الجواب
  $('#quiz').focus({ preventScroll:true });
  const go=$('#go');
  if(isSt){
    reveal(q, null, null);
    go.onclick=()=>{ s.i++; serve(); };
    $('#qprev').onclick=()=>{ s.i--; serve(); };
    return;
  }
  const sel=new Set();
  const refresh=()=>{ go.textContent = sel.size ? t('confirm') : t('none'); };
  refresh();
  $('#opts').querySelectorAll('.opt').forEach(el=>el.onclick=e=>{
    const i=+el.dataset.i;
    sel.has(i)?sel.delete(i):sel.add(i);
    el.setAttribute('aria-pressed', sel.has(i));
    if(e.detail) el.blur();
    refresh();
  });
  go.onclick=()=>grade(q,[...sel]);
  if(isEx){
    clearInterval(tmr);
    const tick=()=>{ const e=$('#tmr'); if(!e) return clearInterval(tmr);
      const v=Math.floor((Date.now()-s.t0)/1000);
      if(s.limit){ const left=s.limit-v; e.textContent=fmtSecs(left); e.classList.toggle('low', left<=60);
        if(left<=0){ clearInterval(tmr); showResults(true); } }
      else e.textContent=fmtSecs(v); };
    tick(); tmr=setInterval(tick,1000);
  }
}

function bump(o,k,ok){ const x=o[k]||(o[k]={a:0,c:0}); x.a++; if(ok) x.c++; }
function grade(q, sel){
  const s=S.sess, cor=q.correct, b=byId(q.branch);
  const hits=sel.filter(i=>cor.includes(i)).length;
  const fp=sel.length-hits;
  const exact = hits===cor.length && fp===0;
  const partial = !exact && hits>0 && fp===0;

  const base = b.points * q.difficulty;
  let gain = 0;
  if(exact) gain = base;
  else if(partial) gain = Math.round(base * hits / Math.max(1,cor.length) * .6);
  if(s.bid==='daily' && gain) gain = Math.round(gain*1.5);

  const p=S.p, td=today();
  p.answered++; p.points+=gain;
  p.seen[q.id]=1;
  if(exact){ p.correct++; p.streak++; p.best=Math.max(p.best,p.streak); }
  else p.streak=0;
  if(q.difficulty>=5 && exact) p.hard++;
  if(s.bid==='mixed') p.mixed++;
  bump(p.byBranch, q.branch, exact);
  bump(p.byDiff, q.difficulty, exact);
  bump(p.byType, q.type||'knowledge', exact);
  bump(p.byLaw, lawGroupKey(q), exact);
  p.days[td]=(p.days[td]||0)+1; pruneDays();
  rollWeek(); p.wk.p+=gain; p.mo.p+=gain;
  if(s.bid==='due') p.rev=(p.rev||0)+1;
  if(s.bid==='daily'){ p.daily={ day:td, ok:exact }; cloudDaily(exact); }
  srsUpdate(q.id, exact);
  bumpChallenges(exact);
  if(exact) delete p.wrong[q.id]; else p.wrong[q.id]=1;
  s.answers.push({id:q.id, exact, gain});
  track('answer', { branch:q.branch, difficulty:q.difficulty, type:q.type||'knowledge', ok:exact?1:0, mode:s.bid });
  if(s.mode==='exam'){ save(); s.i++; if(s.bid==='duel') roomSend('p'); return serve(); }

  reveal(q, sel, {exact, partial, gain});
  const unlocked = checkAch();
  const go=$('#go');
  go.textContent = s.i+1<s.queue.length ? t('next') : t('finish');
  go.onclick=()=>{ s.i++; serve(); };
  save();
  if(unlocked.length) setTimeout(()=>toast('🏅 '+unlocked[0][S.lang][0]),450);
}
function checkAch(){
  const p=S.p, u=ACH.filter(a=>!p.ach.includes(a.id) && a.t(p));
  u.forEach(a=>p.ach.push(a.id));
  return u;
}
function pruneDays(){ const ks=Object.keys(S.p.days); if(ks.length>420) ks.sort().slice(0,ks.length-400).forEach(k=>delete S.p.days[k]); }

function reveal(q, sel, res){
  const cor=q.correct, ex=splitEx(q);
  $('#quiz').classList.add('locked');
  $('#opts').querySelectorAll('.opt').forEach(el=>{
    const i=+el.dataset.i;
    if(sel){ if(cor.includes(i)) el.classList.add(sel.includes(i)?'ok':'miss'); else if(sel.includes(i)) el.classList.add('bad'); else el.classList.add('dim'); }
    else el.classList.add(cor.includes(i)?'ok':'dim');
    const w=ex.why[i];
    if(w) el.querySelector('.tx').insertAdjacentHTML('beforeend', `<small class="why ${cor.includes(i)?'y':'n'}">${md(cleanWhy(w))}</small>`);
  });
  const cover=Object.keys(ex.why).length;
  const kind = res ? (res.exact?'ok':(res.partial?'part':'bad')) : 'info';
  const word = res ? t(res.exact?'stOk':(res.partial?'stPart':'stBad')) : t('stStudy');
  const title = res ? t(res.exact?'right':(res.partial?'partial':'wrong')) : (!cor.length?t('none'):t('study'));
  const head = `<div class="vhead">${stamp(kind, word, !!res)}<div><div class="v" dir="auto">${title}</div>${res&&res.gain?`<div class="gain" dir="auto">+${res.gain} ${t('pts')}${S.sess.bid==='daily'?` <span class="bonus">${t('bonus')}</span>`:''}</div>`:''}</div></div>`;
  const key = ex.key ? `<p class="key">${md(ex.key)}</p>` : '';
  const body = cover>=2 ? `${key}<details><summary dir="auto">${t('fullEx')}</summary><p>${md(ex.body)}</p></details>` : `${key}<p>${md(ex.body)}</p>`;
  $('#verdict').innerHTML=`<div class="verdict ${res?(res.exact?'win':'lose'):'info'}">${head}${body}
      <div class="src"><b>${esc(q.source.law)}</b>، ${esc(q.source.ref)}${prov(q)}</div>
      ${aiRowHTML(q, sel, res)}
      <button class="linkbtn" id="rep" dir="auto">${t('report')}</button>
    </div>`;
  $('#rep').onclick=()=>openReport(q);
  bindAiRow(q, sel, res);
  if(res) $('#verdict').scrollIntoView({behavior:slow?'auto':'smooth',block:'nearest'});
}

function showResults(timeUp){
  const s=S.sess; if(!s || s.over) return; s.over=true;

  clearInterval(tmr); hush();
  for(let k=s.answers.length;k<s.queue.length;k++) s.answers.push({ id:s.queue[k].id, exact:false, gain:0, skip:true });

  const pts=s.answers.reduce((x,a)=>x+a.gain,0);

  $('#quiz').className='';
  $('#quiz').innerHTML=`
    <div class="qhead">
      <button class="x" id="qx" aria-label="${t('back')}">${ICO.x}</button>
      <div class="ti"><b>${t('results')}${s.code?' · '+esc(s.code):''}</b></div>
      <div class="ct">${ok}/${n}</div>
    </div>
    <div class="qbody" dir="rtl">
      ${timeUp?`<div class="banner">${t('timeUp')}</div>`:''}
      <div class="score">${stamp(n&&ok/n>=.5?'ok':'bad', `${ok}/${n}`, true, 124)}<div class="hstats">
        <div><b>${n?Math.round(ok/n*100):0}%</b><span>${t('acc')}</span></div>
        <div><b>${pts}</b><span>${t('scoreL')}</span></div>
        <div><b>${fmtSecs(secs)}</b><span>${t('timeL')}</span></div>
        ${sk?`<div><b>${sk}</b><span>${t('unanswered')}</span></div>`:''}</div></div>
      ${brRows}
      ${s.bid==='duel'?'<div class="rivals hidden" id="rivals" aria-live="polite"></div><div id="dboard"></div>':''}
      <div style="margin-top:12px">${s.answers.map((a,i)=>{ const q=IDX[a.id]; return `
        <button class="res ${a.skip?'skip':(a.exact?'ok':'bad')}" data-i="${i}">
          <span class="rn">${i+1}</span><span class="rt">${esc(q.stem)}</span>
          <span class="rm">${a.skip?'—':(a.exact?'✓':'✗')}</span></button>
        <div class="resx hidden" id="rx${i}">
          <p><b>${q.correct.length?q.correct.map(k=>LTR[k]).join(' + '):esc(T.ar.none)}</b> — ${md(q.explain)}</p>
          <div class="src"><b>${esc(q.source.law)}</b>، ${esc(q.source.ref)}${prov(q)}</div>
        </div>`;}).join('')}</div>

    <div class="qfoot">${s.bid==='duel'
      ? `<div class="duo"><button class="btn" id="go">${t('duelResult')}</button><button class="btn2" id="qx3">${t('close')}</button></div>`

  $('#qx').onclick=()=>{ closeQuiz(); adsBreak(s); };

    $('#go').onclick=()=>{ track('share', { content_type:'duel_result' }); shareText(t('duelMsg').replace('{s}',`${ok}/${n}`).replace('{c}',s.code)+duelLinkLine(s.code)); };
    $('#qx3').onclick=()=>{ closeQuiz(); adsBreak(s); };

function closeQuiz(){ clearInterval(tmr); hush(); roomLeave(); $('#quiz').classList.add('hidden'); $('#quiz').innerHTML=''; S.sess=null; paintLobby(); buildRail(); }

/* ---------- المراجعة المتباعدة (صناديق لايتنر) ---------- */
// الخطأ يعيد البطاقة إلى الصندوق 1 (غداً)، والإصابة ترفعها صندوقاً: 1←3←7←16←35 يوماً
const IV=[0,1,3,7,16,35];
function srsUpdate(id, exact){
  const r=S.p.srs[id]; let box=r?r[0]:0;
  box = exact ? Math.min(5, box?box+1:3) : 1;
  S.p.srs[id]=[box, dnum()+IV[box]];
}
function dueList(){
  const d=dnum(), out=[];
  for(const id in S.p.srs){ const r=S.p.srs[id]; if(r[1]<=d && IDX[id]) out.push([r,IDX[id]]); }
  out.sort((a,b)=>a[0][0]-b[0][0] || a[0][1]-b[0][1]);
  return out.map(x=>x[1]);
}
function openDue(){
  const l=dueList();
  if(!l.length) return toast(t('dueNone'));
  startSess({ bid:'due', mode:'practice', queue:l.slice(0,20), title:t('dueT') });
}

/* ---------- سؤال اليوم: السؤال نفسه لكل المستخدمين في اليوم نفسه ---------- */
function dailyQ(){ return VERIFIED.length ? VERIFIED[hash('qt-daily|'+today())%VERIFIED.length] : null; }
function openDaily(){
  const q=dailyQ(); if(!q) return;
  const done=S.p.daily.day===today();
  startSess({ bid:'daily', mode:done?'study':'practice', queue:[q], title:t('dailyT') });
}

/* ---------- المحفوظات ---------- */
function toggleBm(q){
  const on=!S.p.bm[q.id];
  if(on) S.p.bm[q.id]=1; else delete S.p.bm[q.id];
  const el=$('#qbm'); if(el){ el.classList.toggle('on',on); el.setAttribute('aria-pressed',on); }
  toast(on?t('saved'):t('unsaved')); save();
}
function openBookmarks(){
  const qs=Object.keys(S.p.bm).map(id=>IDX[id]).filter(Boolean);
  if(!qs.length) return sheet(`<h2>${t('bmT')}</h2><div class="empty">${t('bmNone')}</div>`);
  const w=sheet(`<h2>${t('bmT')}</h2>
    <div class="duo" style="margin-bottom:12px"><button class="btn" id="bpr">${t('practice')}</button><button class="btn2" id="bst">${t('study')}</button></div>
    ${qs.map((q,i)=>hitHTML(q,i)).join('')}`);
  w.querySelector('#bpr').onclick=()=>{ w.remove(); startSess({ bid:'bm', mode:'practice', queue:qs.slice(), title:t('bmT') }); };
  w.querySelector('#bst').onclick=()=>{ w.remove(); startSess({ bid:'bm', mode:'study', queue:qs.slice(), title:t('bmT') }); };

}

/* ---------- المكتبة: القانون ← المادة ← تدرّب أو ذاكر ---------- */
function practiceList(qs, title){
  const fresh=qs.filter(q=>!S.p.seen[q.id]);
  startSess({ bid:'lib', mode:'practice', queue:(fresh.length?fresh:qs).slice().sort(byDiff), title });
}
function studyList(qs, title){ startSess({ bid:'lib', mode:'study', queue:qs.slice().sort(byDiff), title }); }

function startCustom(c){
  const pool=builderPool(c);
  const pick=shuffle(pool.filter(q=>!S.p.seen[q.id])).concat(shuffle(pool.filter(q=>S.p.seen[q.id]))).slice(0,c.n);
  if(c.o) pick.sort(byDiff);
  startSess({ bid:'custom', mode:'exam', queue:pick, title:t('customT'), limit:c.m*60 });
}

/* ---------- تحدَّ صديقاً: الرمز يحمل البذرة والنطاق والعدد وبصمة البنك ---------- */
function makeCode(scope, n=10){
  let seed; try{ seed=crypto.getRandomValues(new Uint32Array(1))[0]; }catch(e){ seed=Math.floor(Math.random()*4294967296); }
  return `QT-${(seed>>>0).toString(36).toUpperCase()}-${scope}${n.toString(36).toUpperCase()}-${BANKSIG}`;
}
function parseCode(str){
  const m=String(str||'').trim().toUpperCase().replace(/\s+/g,'').match(/^QT-([0-9A-Z]{1,7})-([0-9A-CX])([0-9A-Z])-([0-9A-Z]{2})$/);
  if(!m) return null;
  const seed=parseInt(m[1],36)>>>0, n=parseInt(m[3],36), scope=m[2];
  if(!n || n>30 || (scope!=='X' && parseInt(scope,36)>=BANK.branches.length)) return null;
  return { seed, scope, n, sig:m[4], code:`QT-${m[1]}-${m[2]}${m[3]}-${m[4]}` };
}
function duelQueue(c){
  const pool = c.scope==='X' ? VERIFIED : VERIFIED.filter(q=>q.branch===BANK.branches[parseInt(c.scope,36)].id);
  const r=rng(c.seed), used=new Set(), out=[], n=Math.min(c.n,pool.length);
  for(let g=0; out.length<n && g<20000; g++){ const i=Math.floor(r()*pool.length); if(!used.has(i)){ used.add(i); out.push(pool[i]); } }
  return out.sort(byDiff);
}
function playCode(str){
  const c=parseCode(str);
  if(!c) return toast(t('duelBad'));
  if(c.sig!==BANKSIG) toast(t('duelVer'));
  startSess({ bid:'duel', mode:'exam', queue:duelQueue(c), title:t('duelT'), code:c.code });
  roomJoin(c.code);
  track('duel_start', { scope:c.scope, n:c.n });
}

/* ---------- المشاركة والاستماع ---------- */
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast(t('copied')); return; }catch(e){}
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(t('copied')); }catch(e){}
  ta.remove();
}
async function shareText(txt){
  try{ if(navigator.share){ await navigator.share({ text:txt }); return; } }
  catch(e){ if(e && e.name==='AbortError') return; }
  copyText(txt);
}
function shareQ(q){
  shareText(`${t('shareHead')}\n\n${q.stem}\n\n${q.options.map((o,i)=>LTR[i]+') '+o).join('\n')}\n\n${t('shareMulti')}`);
}
function speakQ(q){
  const ss=window.speechSynthesis;
  if(ss.speaking){ ss.cancel(); $('#qsp')?.classList.remove('on'); return; }
  const v=ss.getVoices().find(x=>/^ar([-_]|$)/i.test(x.lang));
  if(!v) return toast(t('noVoice'));
  const u=new SpeechSynthesisUtterance(q.stem+'. '+q.options.map((o,i)=>LTR[i]+'، '+o).join('. '));
  u.voice=v; u.lang=v.lang; u.rate=.95;
  u.onend=()=>$('#qsp')?.classList.remove('on');
  ss.cancel(); ss.speak(u); $('#qsp')?.classList.add('on');
}

  return out.sort((x,y)=> x.d<y.d?1:x.d>y.d?-1:0);

function rollChallenges(){
  if(S.p.chal.day!==today()) S.p.chal={ day:today(), d1:0, d2:0, d3:0 };
}
function rollWeek(){ const k=weekKey(); if(S.p.wk.k!==k) S.p.wk={ k, p:0 }; const m=monthKey(); if(!S.p.mo || S.p.mo.k!==m) S.p.mo={ k:m, p:0 }; }
const monthKey = (d=new Date()) => today(d).slice(0,7);
function bumpChallenges(ok){
  rollChallenges(); const c=S.p.chal;
  c.d1=Math.min(10,c.d1+(ok?1:0));
  c.d2=Math.min(15,c.d2+1);
  c.d3=Math.max(c.d3, Math.min(8,S.p.streak));
}

async function pushBoard(){
  rollWeek();

async function readBoard(){
  const keys = await Store.list('lb:', true);
  const rows = [];
  // اللوحة مشتركة بين المستخدمين: لا يُوثق بأي حقل فيها، فتُفرض الأنواع قبل العرض
  const num = v => Number.isFinite(+v) ? Math.max(0, Math.round(+v)) : 0;
  for(const k of keys){
    const v = await Store.get(k, true);
    if(v && v.a) rows.push({ a:String(v.a).slice(0,24), p:num(v.p), s:num(v.s), n:num(v.n), w:String(v.w||''), wp:num(v.wp), m:String(v.m||''), mp:num(v.mp) });
  }
  rows.sort((x,y)=> y.p-x.p || x.a.localeCompare(y.a));
  return rows;
}

async function openBoard(v0){
  const tabs=[['wk',t('week')],['mo',t('month')],['all',t('allTime')],['br',t('brTab')]];
  const w=sheet(`<h2>${t('board')}</h2><div class="hall hidden" id="hall"></div>
    <div class="chips" id="bt">${tabs.map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="false">${esc(l)}</button>`).join('')}</div>
    <div class="chips hs hidden" id="bbr" style="margin-top:8px"></div><div id="bme"></div><div id="bb"><div class="empty">…</div></div>`);
  const cache={}; let tok=0, br=(S.cfg.lbBr && byId(S.cfg.lbBr)) ? S.cfg.lbBr : BANK.branches[0].id;
  const medal=(rk,i)=>{ const r=rk||i+1; return r<=3 ? `<span class="medal m${r}">${r}</span>` : r; };
  const who=r=>`<div style="display:flex;align-items:center;gap:9px">${seal(r.s||hash(r.a),24,hue((r.s||hash(r.a))%360))}<bdi>${esc(r.a)}</bdi></div>`;
  const period=v=> v==='wk' ? weekKey() : v==='mo' ? monthKey() : '';
  if(SB) rpc('qt_hall', { p_week:weekKey(new Date(Date.now()-7*864e5)), p_month:monthKey(new Date(new Date().getFullYear(), new Date().getMonth()-1, 15)) })
    .then(h=>{ const el=w.querySelector('#hall'); if(!el || !h) return;
      const part=(lbl,list)=> list && list.length ? `<span class="hl">${esc(lbl)}</span>`+list.map((x,i)=>{ const sd=(+x.seed>>>0)||hash(String(x.alias));
        return `<span class="hm"><span class="medal m${i+1}">${i+1}</span>${seal(sd,18,hue(sd%360))}<bdi>${esc(String(x.alias).slice(0,24))}</bdi></span>`; }).join('') : '';
      const html=part(t('hallW'),h.w)+part(t('hallM'),h.m); el.innerHTML=html; el.classList.toggle('hidden', !html); }).catch(()=>{});
  const get=async v=>{
    const key=v==='br' ? 'br:'+br : v;
    if(cache[key]) return cache[key];
    if(SB){ try{
      if(v==='br'){ const rows=await rpc('qt_board_branch', { p_branch:br, p_limit:50 });
        return cache[key]={ cloud:true, rows:(rows||[]).map(r=>({ a:String(r.alias||'').slice(0,24), s:(+r.seed>>>0), rk:r.rank|0, c:r.correct|0, n:r.answered|0, acc:r.acc|0 })) }; }
      return cache[key]={ cloud:true, rows:await readCloudBoard(v) }; }catch(e){} }
    if(v==='br'){ const st=S.p.byBranch[br]||{a:0,c:0}; return cache[key]={ cloud:false, rows: st.a>=10 ? [{ a:S.user.alias, s:S.user.seed, c:st.c, n:st.a, acc:Math.round(st.c/st.a*100) }] : [] }; }
    const rows=await readBoard(), k=period(v);
    const list = v==='wk' ? rows.filter(r=>r.w===k && r.wp>0).sort((x,y)=>y.wp-x.wp || x.a.localeCompare(y.a))
               : v==='mo' ? rows.filter(r=>r.m===k && r.mp>0).sort((x,y)=>y.mp-x.mp || x.a.localeCompare(y.a)) : rows;
    return cache[key]={ cloud:false, rows:list };
  };
  const paintMe=async (v, cloud, list)=>{
    const el=w.querySelector('#bme'); el.innerHTML='';
    if(!cloud || v==='br' || !CS.mine) return;
    let r; try{ r=await rpc('qt_my_rank', { p_alias:S.user.alias, p_kind:v==='wk'?'week':v==='mo'?'month':'all', p_key:period(v) }); }catch(e){ return; }
    if(!w.isConnected) return;
    if(!r || !r.rank){ el.innerHTML=`<div class="myrank"><span class="meta">${esc(t('notRanked'))}</span></div>`; return; }
    const rk=S.cfg.rk||(S.cfg.rk={}), k=v+':'+period(v), prev=rk[k], d=prev ? prev-r.rank : 0;
    rk[k]=r.rank; saveCfg();
    const inList=list.some(x=>x.a===S.user.alias);
    el.innerHTML=`<div class="myrank"><div class="mt"><span>${esc(t('myRank'))}</span><b>${r.rank}</b><span>${esc(t('ofN').replace('{n}',r.total))}</span>
      ${d?`<span class="delta ${d>0?'up':'dn'}">${d>0?'▲':'▼'} ${Math.abs(d)} ${esc(t('since'))}</span>`:''}</div>
      <span class="meta">${esc(t('ahead').replace('{p}',r.pct))}</span>
      ${!inList && r.near && r.near.length ? `<table class="near"><tbody>${r.near.map(x=>{ const sd=(+x.seed>>>0)||hash(String(x.alias));
        return `<tr class="${x.alias===S.user.alias?'me':''}"><td class="rk">${x.rank}</td><td>${who({ a:String(x.alias).slice(0,24), s:sd })}</td><td class="p">${x.value}</td></tr>`; }).join('')}</tbody></table>` : ''}</div>`;
  };
  const paint=async v=>{
    const my=++tok;
    w.querySelectorAll('#bt .chip').forEach(c=>c.setAttribute('aria-pressed', c.dataset.v===v));
    const bb=w.querySelector('#bbr');
    bb.classList.toggle('hidden', v!=='br');
    if(v==='br') bb.innerHTML=BANK.branches.map(b=>`<button class="chip" data-br="${b.id}" aria-pressed="${b.id===br}">${esc(bName(b))}</button>`).join('');
    bb.querySelectorAll('[data-br]').forEach(c=>c.onclick=()=>{ br=c.dataset.br; S.cfg.lbBr=br; saveCfg(); paint('br'); });
    const { rows:list, cloud }=await get(v);
    if(my!==tok || !w.isConnected) return;
    const me=r=>r.a===S.user.alias && (!cloud || CS.mine);
    const val=r=> v==='br' ? `${r.c}<small style="color:var(--muted);font-weight:400"> · ${r.acc}٪</small>` : v==='wk' ? r.wp : v==='mo' ? r.mp : r.p;
    w.querySelector('#bb').innerHTML = list.length ? `<table style="margin-top:12px"><thead><tr>
        <th class="rk">${t('rank')}</th><th>${t('player')}</th><th>${v==='br'?t('brCol'):t('pt')}</th></tr></thead><tbody>
        ${list.map((r,i)=>`<tr class="${me(r)?'me':''}"><td class="rk ${(r.rk||i+1)<=3?'top':''}">${medal(r.rk,i)}</td><td>${who(r)}</td><td class="p">${val(r)}</td></tr>`).join('')}
        </tbody></table>
        <p style="font-size:12px;color:var(--muted);margin-top:14px;line-height:1.7">${v==='br'?t('brMin')+' ':''}${cloud?t('cGlobal'):(CLOUD?t('cBoardLocal'):t('shared'))}</p>`
      : `<div class="empty">${v==='br'?t('brMin'):t('noboard')}</div>`;
    paintMe(v, cloud, list);
  };
  w.querySelectorAll('#bt .chip').forEach(c=>c.onclick=()=>paint(c.dataset.v));
  paint(v0 || 'all');
}

/* ---------- اختصارات لوحة المفاتيح ---------- */
document.addEventListener('keydown',e=>{
  const tg=e.target;
  if(tg && (tg.tagName==='INPUT' || tg.tagName==='TEXTAREA')) return;
  const top=$('#sheets').lastElementChild, quizOn=!$('#quiz').classList.contains('hidden');
  if(e.key==='Escape'){
    if(top){ top.remove(); e.preventDefault(); }
    else if(quizOn){ closeQuiz(); e.preventDefault(); }
    return;
  }
  if(top || !quizOn || e.ctrlKey || e.metaKey || e.altKey) return;
  const code=e.code||'';
  const m=code.match(/^(?:Digit|Numpad)([1-4])$/) || code.match(/^Key([A-D])$/);
  if(m){
    const i=/\d/.test(m[1]) ? +m[1]-1 : 'ABCD'.indexOf(m[1]);
    const el=document.querySelector(`#opts .opt[data-i="${i}"]`);
    if(el && !$('#quiz').classList.contains('locked')) el.click();
    e.preventDefault(); return;
  }
  if(e.key==='Enter'){
    if(document.activeElement && document.activeElement.tagName==='BUTTON' && document.activeElement!==document.body) return;
    const g=$('#go'); if(g && !g.disabled){ g.click(); e.preventDefault(); }
    return;
  }
  if(S.sess && S.sess.mode==='study' && (e.key==='ArrowLeft' || e.key==='ArrowRight')){
    const fwd = document.body.dir==='rtl' ? e.key==='ArrowLeft' : e.key==='ArrowRight';
    const b = fwd ? $('#go') : $('#qprev');
    if(b && !b.disabled) b.click();
    e.preventDefault(); return;
  }
  if(code==='KeyS'){ $('#qbm')?.click(); e.preventDefault(); return; }
  if(code==='KeyL'){ $('#qsp')?.click(); e.preventDefault(); }
});
